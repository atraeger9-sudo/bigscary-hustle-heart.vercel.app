// ── STORAGE ────────────────────────────────────────────────────────────────

const USERS = {
  "1111": { name: "Andrew", emoji: "d",
    tagline: "The Gentle Cut \u2014 Lose fat, keep muscle, move like an athlete",

// ── APPLE HEALTH BRIDGE ────────────────────────────────────────────────────
// The iPhone "Big Scary Health Sync" shortcut reads Apple Health (Watch
// sleep/steps/HRV/resting HR + Hume weight/body comp) and opens this app
// with the day's numbers in the URL fragment:
//   #h=<base64url UTF-8 JSON {"v":1,"for":"Andrew","date":"2026-11-14",...}>
// The fragment never leaves the device (browsers don't send it to the
// server). On mount the payload is decoded, validated and staged in a
// single-slot inbox; whichever profile it names applies it on load/login.
// All helpers here are pure except the inbox stage/read/clear trio.
const HEALTH_INBOX_KEY = "bigscary_health_inbox";
const HEALTH_METRIC_KEYS = ["sleep","weight","bf","muscle","steps","exmin","rhr","hrv"];
const healthNum = (v) => { if(v===null||v===undefined||v==="")return undefined; const n=parseFloat(v); return isFinite(n)?n:undefined; };
const decodeHealthPayload = (s) => {
  try{
    if(!s||typeof s!=="string")return null;
    let b64=s.trim().replace(/-/g,"+").replace(/_/g,"/");
    while(b64.length%4)b64+="=";
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const obj=JSON.parse(new TextDecoder("utf-8").decode(bytes));
    return (obj&&typeof obj==="object"&&!Array.isArray(obj))?obj:null;
  }catch(e){ return null; }
};
// Returns a normalized payload {v,for:canonicalName,date:yyyy-mm-dd,...metrics}
// or null. Numbers may arrive as strings — they are coerced here.
const validateHealthPayload = (obj) => {
  if(!obj||typeof obj!=="object"||Array.isArray(obj))return null;
  if(obj.v!==1&&obj.v!=="1")return null;
  const name=Object.values(USERS).map(u=>u.name).find(n=>typeof obj.for==="string"&&n.toLowerCase()===obj.for.trim().toLowerCase());
  if(!name)return null;
  const dm=/^(\d{4})-(\d{2})-(\d{2})$/.exec(typeof obj.date==="string"?obj.date.trim():"");
  if(!dm)return null;
  const y=+dm[1],mo=+dm[2],d=+dm[3];
  const dt=new Date(y,mo-1,d); // local parts — never new Date("yyyy-mm-dd")
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  const p={v:1,for:name,date:`${dm[1]}-${dm[2]}-${dm[3]}`};
  for(const k of HEALTH_METRIC_KEYS){
    const n=healthNum(obj[k]);
    if(n!==undefined)p[k]=(k==="steps"||k==="exmin")?Math.round(n):n;
  }
  return p;
};
const stageHealthPayload = (p) => { try{localStorage.setItem(HEALTH_INBOX_KEY,JSON.stringify({payload:p,receivedAt:Date.now()}));}catch{} };
const readHealthInbox = () => { try{const o=JSON.parse(localStorage.getItem(HEALTH_INBOX_KEY));return (o&&o.payload&&typeof o.payload==="object")?o:null;}catch{return null;} };
const clearHealthInbox = () => { try{localStorage.removeItem(HEALTH_INBOX_KEY);}catch{} };
// Intake: pull #h= out of the URL, stage it if valid, and ALWAYS strip the
// hash (valid or not) so a reload never reprocesses the same payload.
const intakeHealthHash = () => {
  try{
    const m=/#h=([A-Za-z0-9\-_]+)/.exec(window.location.hash||"");
    if(!m)return;
    const p=validateHealthPayload(decodeHealthPayload(m[1]));
    if(p)stageHealthPayload(p);
    else console.warn("Big Scary: ignored an invalid health sync payload in the URL.");
    window.history.replaceState(null,"",window.location.pathname+window.location.search);
  }catch(e){
    try{window.history.replaceState(null,"",window.location.pathname+window.location.search);}catch(_){}
  }
};
const isoToDisplay = (iso) => { const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||""); if(!m)return iso; return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); };
const isoLocalTs = (iso) => { const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||""); return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():Date.now(); };
// Dedupe identity of a payload: its date + the exact metric fields/values.
const healthDedupeKey = (p) => {
  const metrics={};
  for(const k of HEALTH_METRIC_KEYS)if(p[k]!==undefined)metrics[k]=p[k];
  return `${p.date}|${JSON.stringify(metrics)}`;
};
// Merge a validated payload into a profile's data (pure). Weight/sleep go
// to wlog (device values win, note preserved), body comp to scans in
// saveScan's shape, Watch metrics to a capped healthLog. Also stamps
// lastHealthSync for dedupe.
const mergeHealthPayload = (data,p) => {
  const nd={...data};
  const disp=isoToDisplay(p.date);
  const ts=isoLocalTs(p.date);
  if(p.weight!==undefined||p.sleep!==undefined){
    const wl=[...(nd.wlog||[])];
    const idx=wl.findIndex(e=>e.date===disp);
    if(idx>=0){
      const prev=wl[idx];
      wl[idx]={...prev,
        w:p.weight!==undefined?p.weight:prev.w,
        sleep:p.sleep!==undefined?p.sleep:prev.sleep,
        ts:prev.ts||ts};
    }else{
      wl.push({date:disp,w:p.weight!==undefined?p.weight:"",sleep:p.sleep!==undefined?p.sleep:"",n:"",ts});
    }
    wl.sort((a,b)=>(a.ts||0)-(b.ts||0));
    nd.wlog=wl;
  }
  if(p.bf!==undefined||p.muscle!==undefined){
    const sc=[...(nd.scans||[])];
    const idx=sc.findIndex(e=>e.date===disp);
    const entry=idx>=0?{...sc[idx]}:{date:disp,w:"",bf:"",m:"",n:"",ts};
    if(p.weight!==undefined)entry.w=p.weight;
    if(p.bf!==undefined)entry.bf=p.bf;
    if(p.muscle!==undefined)entry.m=p.muscle;
    if(idx>=0)sc[idx]=entry; else sc.push(entry);
    nd.scans=sc;
  }
  if(p.steps!==undefined||p.exmin!==undefined||p.rhr!==undefined||p.hrv!==undefined){
    const hl=[...(nd.healthLog||[])];
    const idx=hl.findIndex(e=>e.iso===p.date);
    const entry=idx>=0?{...hl[idx]}:{date:disp,iso:p.date,ts};
    for(const k of ["steps","exmin","rhr","hrv"])if(p[k]!==undefined)entry[k]=p[k];
    entry.date=disp; entry.ts=ts;
    if(idx>=0)hl[idx]=entry; else hl.push(entry);
    hl.sort((a,b)=>a.iso<b.iso?-1:a.iso>b.iso?1:0);
    nd.healthLog=hl.slice(-90);
  }
  nd.lastHealthSync=healthDedupeKey(p);
  return nd;
};
// Readiness v2 inputs: HRV / resting-HR deviations from the lifter's own
// recent averages. Returns zero comps and an empty why when there isn't
// enough fresh health data — so readiness is untouched without a Watch.
const healthReadinessComps = (healthLog) => {
  const out={hrvComp:0,rhrComp:0,why:""};
  const hl=(healthLog||[]).filter(e=>e&&e.iso);
  if(hl.length<3)return out;
  const sorted=[...hl].sort((a,b)=>a.iso<b.iso?-1:a.iso>b.iso?1:0);
  const latest=sorted[sorted.length-1];
  const todayD=new Date(); todayD.setHours(0,0,0,0);
  const ageDays=Math.round((todayD-new Date(latest.iso+"T00:00:00"))/86400000);
  if(isNaN(ageDays)||ageDays<0||ageDays>2)return out;
  const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));
  const parts=[];
  const withHrv=sorted.filter(e=>parseFloat(e.hrv)>0);
  const lastHrv=parseFloat(latest.hrv);
  if(lastHrv>0&&withHrv.length>=3){
    const last7=withHrv.slice(-7);
    const avg=last7.reduce((s,e)=>s+parseFloat(e.hrv),0)/last7.length;
    if(avg>0){ out.hrvComp=clampN(((lastHrv-avg)/avg)*100,-12,12); parts.push(`HRV ${Math.round(lastHrv)} vs your ${Math.round(avg)} avg`); }
  }
  const withRhr=sorted.filter(e=>parseFloat(e.rhr)>0);
  const lastRhr=parseFloat(latest.rhr);
  if(lastRhr>0&&withRhr.length>=3){
    const last7=withRhr.slice(-7);
    const avg=last7.reduce((s,e)=>s+parseFloat(e.rhr),0)/last7.length;
    out.rhrComp=clampN((avg-lastRhr)*1.5,-8,8); parts.push(`Resting HR ${Math.round(lastRhr)} vs ${Math.round(avg)} avg`);
  }
  out.why=parts.join(" · ");
  return out;
};

// ── CONSTANTS ──────────────────────────────────────────────────────────────
const START_DATE = new Date("2026-06-09"); // Monday June 9
const TRAINING_DAYS_OF_WEEK = [1,2,4,5]; // Mon,Tue,Thu,Fri

// Auto-calculate current week from start date
const calcCurrentWeek = () => {
  const now = new Date();
  const diff = Math.floor((now - START_DATE) / (1000*60*60*24*7));
  return Math.max(1, Math.min(12, diff + 1));
};

// Per-user program start (yyyy-mm-dd, local time). Each profile advances
// from its own start/restart date instead of one global calendar.
const isoToday = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const isoDaysAgo = (n) => { const d=new Date(); d.setDate(d.getDate()-n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const weekFromStart = (iso) => {
  if(!iso) return null;
  const start=new Date(iso+"T00:00:00");
  if(isNaN(start)) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.floor((today-start)/(1000*60*60*24*7));
  return Math.max(1, Math.min(12, diff + 1));
};

// Phase from week (auto-gate)
const phaseFromWeek = (w) => {
  if (w <= 4) return 0;
  if (w <= 8) return 1;
  return 2;
};

// Deload every 4th week
const isDeload = (w) => w % 4 === 0;

// 1RM calculator (Epley formula)
const calc1RM = (weight, reps) => {
  if (!weight || !reps || reps <= 0) return 0;
  return Math.round(parseFloat(weight) * (1 + parseInt(reps) / 30));
};

// Volume calculator
const calcVolume = (sets) => {
  return sets.filter(s=>!s.isWarmup).reduce((sum,s) => {
    return sum + (parseFloat(s.w)||0) * (parseInt(s.r)||0);
  }, 0);
};

// Progressive overload engine
const isCompound = n => /squat|deadlift|bench|press|row|pull.up|thrust|lunge|dip/i.test(n);
const isLowerBody = n => /squat|deadlift|thrust|lunge|leg|calf|tibialis/i.test(n);

const calcTarget = (lastSets, ex, week, phase, opts={}) => {
  if (!lastSets || lastSets.length === 0 || week <= 1) return null;
  const workSets = lastSets.filter(s => !s.isWarmup && !s.isBurnout);
  if (!workSets.length) return null;
  const lower = isLowerBody(ex.n);
  const weightInc = ex.nw ? 0 : lower ? 10 : isCompound(ex.n) ? 5 : 2.5;
  const allHit = workSets.every(s => {
    const reps = parseInt(s.r)||0;
    const rir  = parseInt(s.rir);
    const tgt  = typeof ex.r==="number" ? ex.r : parseInt(ex.r)||10;
    return reps >= tgt && (isNaN(rir) || rir <= 1);
  });
  const lastW = parseFloat(workSets[0]?.w)||0;
  const tgtR  = typeof ex.r==="number" ? ex.r : parseInt(ex.r)||10;
  // Autoregulation: react to HOW last week went, not just hit/miss.
  // Sets that fell short by 2+ reps on average back the weight off 5%;
  // hitting every set with 3+ reps in reserve earns a double jump.
  // The deload branch below is untouched and still takes precedence.
  const missedSets = workSets.filter(s => (parseInt(s.r)||0) < tgtR);
  const avgMiss = missedSets.length
    ? missedSets.reduce((sum,s)=>sum+(tgtR-(parseInt(s.r)||0)),0)/missedSets.length
    : 0;
  const rirSets = workSets.filter(s => !isNaN(parseInt(s.rir)));
  const avgRir = rirSets.length
    ? rirSets.reduce((sum,s)=>sum+parseInt(s.rir),0)/rirSets.length
    : null;
  let autoNote = null;
  let nextW;
  // Personal pace (Smart Coaching): if this lifter has a learned
  // increment for this lift, it prescribes the jump on the allHit path.
  const pInc = allHit ? personalIncrement(opts.history, ex) : null;
  if (!allHit && avgMiss >= 2) {
    nextW = Math.round((lastW * 0.95) / 2.5) * 2.5;
    autoNote = "Backed off 5% — last week missed reps";
  } else if (allHit && pInc !== null) {
    nextW = lastW + pInc;
    autoNote = `Personal pace: +${pInc} lb — learned from your log`;
  } else if (allHit && avgRir !== null && avgRir >= 3) {
    nextW = lastW + weightInc * 2;
    autoNote = "Bigger jump — last week had 3+ reps in reserve";
  } else {
    nextW = allHit ? lastW + weightInc : lastW;
  }
  // Readiness scaling (Smart Coaching): today's readiness eases or
  // sharpens the final target. Never on a deload week (the deload
  // branch below still wins outright). Note priority: back-off >
  // readiness > personal pace > bigger jump — a readiness note
  // replaces pace/jump notes but never the back-off warning.
  const rd = opts.readiness;
  if (rd && rd.factor !== 1 && !isDeload(week)) {
    nextW = Math.max(0, Math.round((nextW * rd.factor) / 2.5) * 2.5);
    const pct = Math.abs(Math.round((rd.factor - 1) * 100));
    const rNote = rd.factor < 1
      ? `Readiness ${rd.score} — targets eased ${pct}% today`
      : `Readiness ${rd.score} — primed, +${pct}% today`;
    if (!autoNote || autoNote.indexOf("Backed off") !== 0) autoNote = rNote;
  }
  if (isDeload(week)) {
    // Deload week: 60% of last working weight, rounded to nearest 5.
    // No FAILURE/BURNOUT final set \u2014 recovery is the point of the week.
    const dw = Math.max(0, Math.round((lastW * 0.6) / 5) * 5);
    return Array.from({length:ex.s},()=>({
      w: dw.toString(),
      r: tgtR.toString(),
      isBurnout: false,
      deload: true,
    }));
  }
  if (phase===2) {
    const out2 = Array.from({length:ex.s},(_,i)=>({
      w: Math.max(0, nextW-(i*(lower?10:5))).toString(),
      r: i===ex.s-1?"FAILURE":tgtR.toString(),
      isBurnout: i===ex.s-1,
    }));
    if (autoNote) out2.forEach(s=>{ s.autoNote = autoNote; });
    return out2;
  }
  const out = Array.from({length:ex.s},(_,i)=>({
    w: nextW.toString(),
    r: i===ex.s-1&&phase>=1?"BURNOUT":tgtR.toString(),
    isBurnout: i===ex.s-1&&phase>=1,
  }));
  if (autoNote) out.forEach(s=>{ s.autoNote = autoNote; });
  return out;
};

// ── Personal pace helpers (Smart Coaching) ──────────────────────────
// Top work-set weight of one logged week (first work set, matching
// calcTarget's lastW convention).
const weekTopW = (sets) => {
  const ws = (sets || []).filter(s => !s.isWarmup && !s.isBurnout);
  return ws.length ? parseFloat(ws[0].w) || 0 : 0;
};
// Same hit rule calcTarget applies to lastSets: every work set at
// target reps with RIR <= 1 (missing RIR counts as a hit).
const weekAllHit = (sets, ex) => {
  const ws = (sets || []).filter(s => !s.isWarmup && !s.isBurnout);
  if (!ws.length) return false;
  const tgt = typeof ex.r === "number" ? ex.r : parseInt(ex.r) || 10;
  return ws.every(s => {
    const reps = parseInt(s.r) || 0;
    const rir  = parseInt(s.rir);
    return reps >= tgt && (isNaN(rir) || rir <= 1);
  });
};
// Learn the jump size THIS lifter actually succeeds with on THIS lift.
// Walk consecutive logged weeks: a "successful jump" is a week whose
// top weight rose vs the prior logged week AND whose sets all hit —
// the median of those deltas is the personal pace. Separately, if the
// two most recent logged weeks both raised the weight and both missed,
// the pace halves (recent failure outweighs the older median). Returns
// null when there is nothing to learn or the learned pace equals the
// default increment, so callers fall back to stock behavior.
const personalIncrement = (history, ex) => {
  if (!history || history.length < 2 || ex.nw) return null;
  const lower = isLowerBody(ex.n);
  const defInc = lower ? 10 : isCompound(ex.n) ? 5 : 2.5;
  const bounds = lower ? [5, 20] : isCompound(ex.n) ? [2.5, 10] : [1.25, 5];
  const tops = history.map(weekTopW);
  const deltas = [];
  for (let i = 1; i < history.length; i++) {
    const d = tops[i] - tops[i - 1];
    if (d > 0 && weekAllHit(history[i], ex)) deltas.push(d);
  }
  let inc = null;
  if (deltas.length >= 2) {
    const sorted = [...deltas].sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    inc = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
  }
  if (history.length >= 3) {
    const n = history.length;
    const up1 = tops[n - 2] > tops[n - 3], up2 = tops[n - 1] > tops[n - 2];
    if (up1 && up2 && !weekAllHit(history[n - 2], ex) && !weekAllHit(history[n - 1], ex)) {
      inc = Math.max(bounds[0], defInc / 2);
    }
  }
  if (inc === null) return null;
  inc = Math.round(Math.max(bounds[0], Math.min(bounds[1], inc)) * 4) / 4;
  return inc === defInc ? null : inc;
};

// Warm-up sets generator
const calcWarmups = (workWeight, ex) => {
  if (!workWeight || ex.nw || parseFloat(workWeight) < 45) return [];
  const w = parseFloat(workWeight);
  if (!isCompound(ex.n)) return [];
  return [
    {w: Math.round(w*0.4).toString(), r:"10", isWarmup:true, label:"Warm-up 1"},
    {w: Math.round(w*0.6).toString(), r:"6",  isWarmup:true, label:"Warm-up 2"},
    {w: Math.round(w*0.8).toString(), r:"3",  isWarmup:true, label:"Warm-up 3"},
  ];
};

// ── PHASES ─────────────────────────────────────────────────────────────────
const PHASES=[
  {id:0,label:"Phase 1",sub:"Recomp Foundation",weeks:"Wks 1-4",color:C.blue,
   goal:"Fix movement. Build habit. Protect muscle."},
  {id:1,label:"Phase 2",sub:"Strength & Recomp",weeks:"Wks 5-8",color:C.yellow,
   goal:"Progressive overload. Fuel the recomp. Get hard."},
  {id:2,label:"Phase 3",sub:"Final Recomp",weeks:"Wks 9-12",color:C.red,
   goal:"Recomp to the finish. Look big and scary."},
];

// ── WORKOUTS ───────────────────────────────────────────────────────────────

// ── CONDITIONING (VO2max) ───────────────────────────────────────────────────
// Scheduled on rest days, not lifting days — same-day interference with the
// heavy compound lifts (and the fatigue cost of stacking both on a day
// already in a calorie deficit) outweighs the convenience. 2x/week is enough
// to drive meaningful VO2max gains without competing with the strength/
// hypertrophy goals for recovery. Low-impact modalities (bike, rower,
// incline walk/elliptical) are called out explicitly given the knee history

// ── REST TIMER ─────────────────────────────────────────────────────────────
const RestTimer=({onClose})=>{
  const [secs,setSecs]=useState(90);
  const [run,setRun]=useState(false);
  const [init,setInit]=useState(90);
  const ref=useRef(null);
  useEffect(()=>{
    if(run){ref.current=setInterval(()=>setSecs(s=>{if(s<=1){clearInterval(ref.current);setRun(false);return 0;}return s-1;}),1000);}
    else clearInterval(ref.current);
    return()=>clearInterval(ref.current);
  },[run]);
  const r=54,ci=2*Math.PI*r,pct=secs/init;
  return(
    <div style={{position:"fixed",inset:0,zIndex:300,display:"flex",alignItems:"flex-end",background:"rgba(0,0,0,0.9)"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{width:"100%",maxWidth:430,margin:"0 auto",background:C.card,borderRadius:"16px 16px 0 0",padding:"28px 20px calc(48px + env(safe-area-inset-bottom))",borderBottom:"none",textAlign:"center"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <p style={{margin:0,fontSize:12,color:C.muted,letterSpacing:"0.25em",textTransform:"uppercase",fontFamily:FC}}>REST TIMER</p>
          <button onClick={onClose} aria-label="Close rest timer" style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,width:32,height:32,color:C.text,fontSize:16,cursor:"pointer",lineHeight:1}}>✕</button>
        </div>
        <svg width="130" height="130" viewBox="0 0 130 130" style={{display:"block",margin:"0 auto 20px"}}>
          <circle cx="65" cy="65" r={r} fill="none" stroke={C.border} strokeWidth="6"/>
          <circle cx="65" cy="65" r={r} fill="none" stroke={C.yellow} strokeWidth="6"
            strokeDasharray={ci} strokeDashoffset={ci*(1-pct)} strokeLinecap="round"
            transform="rotate(-90 65 65)" style={{transition:"stroke-dashoffset 1s linear"}}/>
          <text x="65" y="70" textAnchor="middle" fill={C.text} fontSize="28" fontFamily={FC} fontWeight="bold">
            {Math.floor(secs/60)}:{String(secs%60).padStart(2,"0")}
          </text>
        </svg>
        <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:20}}>
          {[60,90,120,180].map(p=>(<button key={p} onClick={()=>{setSecs(p);setInit(p);setRun(false);}}
            style={{background:init===p?C.yellow:C.surface,color:init===p?"#000":C.steel,border:`1px solid ${init===p?C.yellow:C.border}`,borderRadius:8,padding:"8px 12px",fontSize:13,cursor:"pointer",fontFamily:FC}}>{p}s</button>))}
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setRun(!run)} style={{flex:1,background:run?C.redDim:C.yellow,color:run?C.text:"#000",border:"none",borderRadius:10,padding:"14px",fontSize:15,fontWeight:"bold",cursor:"pointer",fontFamily:FC,letterSpacing:"0.1em"}}>
            {run?"PAUSE":"START"}
          </button>
          <button onClick={()=>{setSecs(init);setRun(false);}} style={{background:C.surface,color:C.steel,border:`1px solid ${C.border}`,borderRadius:10,padding:"14px 16px",fontSize:13,cursor:"pointer"}}>RESET</button>
        </div>
      </div>
    </div>
  );
};

// ── INLINE TIMER ───────────────────────────────────────────────────────────
const InlineTimer=({seconds,label,onDone})=>{
  const [secs,setSecs]=useState(seconds);
  const [done,setDone]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    ref.current=setInterval(()=>setSecs(s=>{if(s<=1){clearInterval(ref.current);setDone(true);onDone&&onDone();return 0;}return s-1;}),1000);
    return()=>clearInterval(ref.current);
  },[]);
  const pct=secs/seconds;
  const col=done?C.green:secs<30?C.red:C.yellow;
  return(
    <div style={{background:C.surface,borderRadius:10,padding:"10px 14px",marginTop:8,display:"flex",alignItems:"center",gap:12,border:`1px solid ${col}44`}}>
      <div style={{width:40,height:40,flexShrink:0,position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <svg width="40" height="40" viewBox="0 0 40 40" style={{position:"absolute"}}>
          <circle cx="20" cy="20" r="17" fill="none" stroke={C.border} strokeWidth="3"/>
          <circle cx="20" cy="20" r="17" fill="none" stroke={col} strokeWidth="3"
            strokeDasharray="106.8" strokeDashoffset={106.8*(1-pct)} strokeLinecap="round"
            transform="rotate(-90 20 20)" style={{transition:"stroke-dashoffset 1s linear"}}/>
        </svg>
        <span style={{fontSize:11,fontWeight:"bold",fontFamily:FC,color:col,position:"relative",zIndex:1,textAlign:"center"}}>
          {done?"GO":secs>=60?`${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}`:secs}
        </span>
      </div>
      <div>
        <p style={{margin:0,fontSize:12,fontWeight:"bold",fontFamily:FC,color:done?C.green:C.text}}>{done?"REST DONE - NEXT SET!":(label||"REST")}</p>
        <p style={{margin:0,fontSize:12,color:C.muted,fontFamily:FB}}>{done?"Go when ready":secs<30?"Almost time...":"Recover fully"}</p>
      </div>
    </div>
  );
};

      ))}

  </div>
);

// ── LOG MODAL (Full Progressive Overload) ─────────────────────────────────
const LogModal=({ex,hasNext,pc,lastSets,targets,week,phase,allHistory,onSave,onClose})=>{
  const baseline=!week||week<=1;
  const deloadWeek=isDeload(week||1);
  const compound=isCompound(ex.n);
  const restSecs=compound?150:60;
  const workSets=(lastSets||[]).filter(s=>!s.isWarmup&&!s.isBurnout);
  const lastWeight=parseFloat(workSets[0]?.w)||0;
  const suggestedWarmups=lastWeight>0?calcWarmups(lastWeight.toString(),ex):[];
  const initSets=workSets.length>0
    ?workSets.map(s=>({...s,rir:s.rir||"",logged:false}))
    :Array.from({length:ex.s},()=>({r:"",w:"",rir:"",logged:false}));
  const [sets,setSets]=useState(initSets);
  const [warmupIdx,setWarmupIdx]=useState(0);
  const [warmupsLogged,setWarmupsLogged]=useState(false);
  const [activeSet,setActiveSet]=useState(0);
  const [restTimer,setRestTimer]=useState(null);
  const [timerKey,setTimerKey]=useState(0);
  const [burnoutReady,setBurnoutReady]=useState(false);
  const [showBurnout,setShowBurnout]=useState(false);
  const [burnout,setBurnout]=useState({w:"",r:"",rir:""});
  const [sessionNote,setSessionNote]=useState("");
  const [showHistory,setShowHistory]=useState(false);
  const [showWarmups,setShowWarmups]=useState(compound&&!ex.nw);

  const upd=(i,f,v)=>setSets(p=>p.map((s,idx)=>idx===i?{...s,[f]:v}:s));
  const updB=(f,v)=>setBurnout(b=>({...b,[f]:v}));

  const logSet=(i)=>{
    setSets(p=>p.map((s,idx)=>idx===i?{...s,logged:true}:s));
    const isLast=i===sets.length-1;
    const label=compound?"2.5 MIN REST":"60s REST";
    if(isLast&&phase>=1&&!deloadWeek){
      setRestTimer({secs:180,label:"BURNOUT REST - 3 MIN"});
      setTimerKey(k=>k+1);
    } else {
      setRestTimer({secs:restSecs,label});
      setTimerKey(k=>k+1);
      setActiveSet(Math.min(i+1,sets.length-1));
    }
    if(isLast&&phase>=1&&!deloadWeek){
      setTimeout(()=>setBurnoutReady(true),180000);
    }
  };

  const getStatus=(i)=>{
    if(baseline||!targets||!targets[i]) return "base";
    const s=sets[i];if(!s.logged)return "base";
    const tW=parseFloat(targets[i]?.w)||0,tR=parseInt(targets[i]?.r)||0;
    const aW=parseFloat(s.w)||0,aR=parseInt(s.r)||0;
    if(aW>=tW&&aR>=tR)return "hit";
    if(aW>=tW*0.95&&aR>=tR-1)return "close";
    return "miss";
  };
  const SC={hit:C.green,close:C.yellow,miss:C.red,base:C.border};
  const SL={hit:"HIT",close:"CLOSE",miss:"MISSED",base:""};

  const est1RM=()=>{
    const topSet=sets.filter(s=>s.logged&&!s.isBurnout&&s.w&&s.r).sort((a,b)=>parseFloat(b.w)-parseFloat(a.w))[0];
    if(!topSet)return null;
    return calc1RM(topSet.w,topSet.r);
  };

  const vol=calcVolume(sets.filter(s=>s.logged));
  const prev1RM=allHistory&&allHistory.length>0?allHistory.reduce((best,wk)=>{
    const top=(wk||[]).filter(s=>!s.isWarmup&&!s.isBurnout&&s.w&&s.r).sort((a,b)=>parseFloat(b.w)-parseFloat(a.w))[0];
    const rm=top?calc1RM(top.w,top.r):0;
    return rm>best?rm:best;
  },0):0;
  const current1RM=est1RM();
  const isPR=current1RM&&prev1RM&&current1RM>prev1RM;

  return(
    <div style={{position:"fixed",inset:0,zIndex:200,display:"flex",alignItems:"flex-end",background:"rgba(0,0,0,0.92)"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{width:"100%",maxWidth:430,margin:"0 auto",background:C.card,borderRadius:"16px 16px 0 0",padding:"20px 16px calc(40px + env(safe-area-inset-bottom))",borderBottom:"none",maxHeight:"92vh",overflowY:"auto"}}>

        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div style={{flex:1,paddingRight:8}}>
            <p style={{margin:0,fontSize:12,color:pc,letterSpacing:"0.2em",textTransform:"uppercase",fontFamily:FC}}>
              {baseline?"WEEK 1 - SET BASELINE":"WEEK "+(week||1)+" TARGETS"}
            </p>
            <p style={{margin:"2px 0 4px",fontSize:17,fontWeight:"bold",fontFamily:FC}}>{ex.n}</p>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:pc+"22",color:pc,fontFamily:FC}}>
                {ex.s} sets x {ex.r}{typeof ex.r==="number"?" reps":""}
              </span>
              <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:C.surface,color:C.muted,fontFamily:FC}}>
                {compound?"Compound 2.5min":"Isolation 60s"}
              </span>
              {phase>=1&&!deloadWeek&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:C.red+"22",color:C.red,fontFamily:FC}}>BURNOUT</span>}
              {deloadWeek&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:C.yellow+"22",color:C.yellow,fontFamily:FC}}>DELOAD 60%</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:6,flexShrink:0}}>
            {allHistory&&allHistory.length>0&&(
              <button onClick={()=>setShowHistory(!showHistory)} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 8px",cursor:"pointer",fontSize:11,color:C.steel,fontFamily:FC}}>
                HISTORY
              </button>
            )}
            <button onClick={onClose} style={{background:"transparent",border:"none",cursor:"pointer",padding:4}}>
              <Ic n="x" sz={22} col={C.steel}/>
            </button>
          </div>
        </div>

        {/* Exercise history */}
        {showHistory&&allHistory&&(
          <div style={{background:C.surface,borderRadius:10,padding:"12px 14px",marginBottom:12,border:`1px solid ${C.border}`}}>
            <p style={{margin:"0 0 8px",fontSize:12,color:C.yellow,fontFamily:FC,letterSpacing:"0.1em",textTransform:"uppercase"}}>Exercise History</p>
            {allHistory.map((wkSets,i)=>{
              const ws=(wkSets||[]).filter(s=>!s.isWarmup&&!s.isBurnout);
              const rm=ws[0]?calc1RM(ws[0].w,ws[0].r):0;
              const v=calcVolume(ws);
              return(
                <div key={i} style={{marginBottom:6,paddingBottom:6,borderBottom:i<allHistory.length-1?`1px solid ${C.border}22`:"none"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                    <span style={{fontSize:12,fontFamily:FC,color:C.muted}}>Week {i+1}</span>
                    <div style={{display:"flex",gap:8}}>
                      {rm>0&&<span style={{fontSize:12,fontFamily:FC,color:C.yellow}}>~1RM: {rm}lb</span>}
                      {v>0&&<span style={{fontSize:12,fontFamily:FC,color:C.steel}}>{Math.round(v).toLocaleString()}lb vol</span>}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                    {ws.map((s,j)=>(
                      <span key={j} style={{fontSize:11,padding:"2px 7px",borderRadius:5,background:C.card,color:C.steel,fontFamily:FC}}>
                        {s.w?`${s.w}lb`:"BW"} x {s.r}{s.rir!==undefined&&s.rir!==""?` RIR${s.rir}`:""}
                      </span>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* Baseline notice */}
        {baseline&&(
          <div style={{background:C.yellow+"22",borderRadius:8,padding:"9px 12px",marginBottom:12,border:`1px solid ${C.yellow}44`}}>
            <p style={{margin:0,fontSize:12,color:C.yellow,fontFamily:FB,lineHeight:1.5}}>
              Week 1 - Log your real working weights. Week 2+ calculates targets automatically. Hit all reps + RIR 0-1 = weight goes up. Miss reps = same weight repeated.
            </p>
          </div>
        )}

        {/* Warm-up sets */}
        {showWarmups&&suggestedWarmups.length>0&&!warmupsLogged&&(
          <div style={{background:C.surface,borderRadius:10,padding:"12px 14px",marginBottom:12,border:`1px solid ${C.border}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <p style={{margin:0,fontSize:12,fontFamily:FC,color:C.steel,letterSpacing:"0.1em",textTransform:"uppercase"}}>Warm-Up Sets</p>
              <button onClick={()=>setShowWarmups(false)} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:C.muted,fontFamily:FC}}>SKIP</button>
            </div>
            {suggestedWarmups.map((wu,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 0",borderBottom:i<suggestedWarmups.length-1?`1px solid ${C.border}33`:"none"}}>
                <span style={{fontSize:12,color:C.muted,fontFamily:FC}}>{wu.label}</span>
                <div style={{display:"flex",gap:10,alignItems:"center"}}>
                  <span style={{fontSize:13,fontWeight:"bold",fontFamily:FC,color:C.steel}}>{wu.w}lb x {wu.r}</span>
                  {i===warmupIdx&&(
                    <button onClick={()=>{if(i===suggestedWarmups.length-1)setWarmupsLogged(true);else setWarmupIdx(i+1);}}
                      style={{background:C.steel+"33",border:`1px solid ${C.steel}44`,borderRadius:6,padding:"4px 10px",fontSize:12,color:C.steel,cursor:"pointer",fontFamily:FC}}>
                      DONE
                    </button>
                  )}
                  {i<warmupIdx&&<span style={{fontSize:12,color:C.green,fontFamily:FC}}>done</span>}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Working sets */}
        {sets.map((s,i)=>{
          const status=getStatus(i);
          const sc=SC[status];
          const target=targets&&targets[i];
          const isActive=i===activeSet&&!s.logged;
          return(
            <div key={i} style={{borderRadius:10,padding:"12px 14px",marginBottom:8,
              background:s.logged?sc+"11":isActive?pc+"11":C.surface,
              border:`1px solid ${s.logged?sc+"66":isActive?pc+"44":C.border}`,
              transition:"all 0.3s"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:12,fontFamily:FC,fontWeight:700,color:isActive?pc:C.muted,letterSpacing:"0.1em"}}>SET {i+1}</span>
                  {isActive&&!s.logged&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:pc,color:"#000",fontFamily:FC,fontWeight:700}}>ACTIVE</span>}
                  {s.logged&&status!=="base"&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:sc+"22",color:sc,fontFamily:FC}}>{SL[status]}</span>}
                </div>
                {target&&!baseline&&(
                  <span style={{fontSize:12,color:C.muted,fontFamily:FC}}>
                    Target: {target.isBurnout?"BURNOUT":target.w+"lb x "+target.r}
                  </span>
                )}
              </div>
              <div style={{display:"flex",gap:8}}>
                {!ex.nw&&(
                  <div style={{flex:1}}>
                    <p style={{margin:"0 0 4px",fontSize:11,color:C.muted,fontFamily:FC,letterSpacing:"0.1em"}}>WEIGHT (lbs)</p>
                    <input value={s.w} onChange={e=>upd(i,"w",e.target.value)}
                      placeholder={target&&!baseline?target.w:"0"} type="number"
                      style={{width:"100%",background:C.bg,border:`1px solid ${isActive?pc+"88":C.border}`,borderRadius:8,padding:"10px",color:C.text,fontSize:20,fontFamily:FC,outline:"none",textAlign:"center",fontWeight:"bold"}}/>
                  </div>
                )}
                <div style={{flex:1}}>
                  <p style={{margin:"0 0 4px",fontSize:11,color:C.muted,fontFamily:FC,letterSpacing:"0.1em"}}>REPS</p>
                  <input value={s.r} onChange={e=>upd(i,"r",e.target.value)}
                    placeholder={target&&!baseline?target.r:typeof ex.r==="number"?String(ex.r):ex.r||"0"}
                    style={{width:"100%",background:C.bg,border:`1px solid ${isActive?pc+"88":C.border}`,borderRadius:8,padding:"10px",color:C.text,fontSize:20,fontFamily:FC,outline:"none",textAlign:"center",fontWeight:"bold"}}/>
                </div>
              </div>
              <RIRSelect value={s.rir} onChange={v=>upd(i,"rir",v)}/>
              {!s.logged&&(
                <button onClick={()=>logSet(i)}
                  style={{width:"100%",marginTop:10,background:isActive?pc:C.surface,color:isActive?"#000":C.muted,border:`1px solid ${isActive?pc:C.border}`,borderRadius:8,padding:"11px",fontSize:12,fontWeight:"bold",cursor:"pointer",fontFamily:FC,letterSpacing:"0.1em",textTransform:"uppercase"}}>
                  LOG SET {i+1}
                </button>
              )}
            </div>
          );
        })}

        {/* Live 1RM + Volume */}
        {sets.some(s=>s.logged&&s.w&&s.r)&&(
          <div style={{background:C.surface,borderRadius:10,padding:"10px 14px",marginBottom:8,display:"flex",gap:12,border:`1px solid ${C.border}`}}>
            {current1RM&&(
              <div style={{flex:1,textAlign:"center"}}>
                <p style={{margin:0,fontSize:11,color:C.muted,fontFamily:FC,letterSpacing:"0.1em"}}>EST 1RM</p>
                <p style={{margin:0,fontSize:18,fontWeight:"bold",fontFamily:FD,color:isPR?C.yellow:C.text}}>
                  {current1RM}lb {isPR&&"PR!"}
                </p>
                {isPR&&<p style={{margin:0,fontSize:11,color:C.yellow,fontFamily:FC}}>NEW RECORD +{current1RM-prev1RM}lb</p>}
              </div>
            )}
            {vol>0&&(
              <div style={{flex:1,textAlign:"center",borderLeft:`1px solid ${C.border}`,paddingLeft:12}}>
                <p style={{margin:0,fontSize:11,color:C.muted,fontFamily:FC,letterSpacing:"0.1em"}}>SESSION VOLUME</p>
                <p style={{margin:0,fontSize:18,fontWeight:"bold",fontFamily:FD,color:C.steel}}>{Math.round(vol).toLocaleString()}lb</p>
              </div>
            )}
          </div>
        )}

        {/* Rest timer */}
        {restTimer&&<InlineTimer key={timerKey} seconds={restTimer.secs} label={restTimer.label} onDone={()=>{if(phase>=1&&!deloadWeek&&sets.every(s=>s.logged))setBurnoutReady(true);}}/>}

        {/* Burnout section */}
        {phase>=1&&!deloadWeek&&sets.every(s=>s.logged)&&!showBurnout&&(
          <div style={{background:C.red+"22",borderRadius:10,padding:"14px",border:`1px solid ${C.red}66`,marginTop:8}}>
            <p style={{margin:"0 0 4px",fontSize:16,fontWeight:600,fontFamily:FD,color:C.red}}>Burnout Set</p>
            <p style={{margin:"0 0 10px",fontSize:12,color:C.muted,fontFamily:FB,lineHeight:1.5}}>
              {burnoutReady?"REST DONE. Drop 30%. Go to absolute failure. Every last rep.":"Rest 3 min then go to absolute failure. Drop 30% of working weight."}
            </p>
            {burnoutReady&&(
              <button onClick={()=>setShowBurnout(true)}
                style={{width:"100%",background:C.red,color:"#000",border:"none",borderRadius:8,padding:"12px",fontSize:14,fontWeight:"bold",cursor:"pointer",fontFamily:FC,letterSpacing:"0.1em",textTransform:"uppercase"}}>
                LOG BURNOUT SET
              </button>
            )}
          </div>
        )}
        {showBurnout&&(
          <div style={{background:C.red+"22",borderRadius:10,padding:"14px",border:`1px solid ${C.red}`,marginTop:8}}>
            <p style={{margin:"0 0 10px",fontSize:16,fontWeight:600,fontFamily:FD,color:C.red}}>Burnout — Absolute Failure</p>
            <div style={{display:"flex",gap:8,marginBottom:8}}>
              {!ex.nw&&(
                <div style={{flex:1}}>
                  <p style={{margin:"0 0 4px",fontSize:11,color:C.red,fontFamily:FC}}>WEIGHT (-30%)</p>
                  <input value={burnout.w} onChange={e=>updB("w",e.target.value)}
                    placeholder={sets[0]?.w?String(Math.round(parseFloat(sets[0].w)*0.7)):""}
                    type="number" style={{width:"100%",background:C.bg,border:`1px solid ${C.red}`,borderRadius:8,padding:"10px",color:C.red,fontSize:20,fontFamily:FC,outline:"none",textAlign:"center",fontWeight:"bold"}}/>
                </div>
              )}
              <div style={{flex:1}}>

// ── SESSION COMPLETE MODAL ─────────────────────────────────────────────────
const SessionComplete=({wo,data,ph,di,week,onClose})=>{
  const exercises=wo.ex;
  // Use both WK key AND SK2 key to find sets (handles stale data on first log)
  const getSets=(i)=>{
    const wkSets=data[`p${ph}_d${di}_e${i}_w${week}`]||[];
    if(wkSets.length>0)return wkSets;
    return data[`p${ph}_d${di}_e${i}`]||[];
  };
  const totalVol=exercises.reduce((sum,ex,i)=>{
    const sets=getSets(i).filter(s=>!s.isWarmup);
    return sum+calcVolume(sets);
  },0);
  const PRs=exercises.reduce((acc,ex,i)=>{
    const sets=getSets(i).filter(s=>!s.isWarmup&&!s.isBurnout);
    const top=[...sets].sort((a,b)=>parseFloat(b.w)-parseFloat(a.w))[0];
    if(!top||!top.w||!top.r)return acc;
    const rm=calc1RM(top.w,top.r);
    const hist=Array.from({length:week-1},(_,w)=>data[`p${ph}_d${di}_e${i}_w${w+1}`]||[]);
    const prevBest=hist.reduce((best,wkSets)=>{
      const t=(wkSets||[]).filter(s=>!s.isWarmup&&!s.isBurnout).sort((a,b)=>parseFloat(b.w)-parseFloat(a.w))[0];
      const r=t?calc1RM(t.w,t.r):0;return r>best?r:best;
    },0);
    if(rm>prevBest&&prevBest>0)acc.push({name:ex.n,rm,prev:prevBest,gain:rm-prevBest});
    return acc;
  },[]);
  const doneCount=exercises.filter((_,i)=>!!data[`done_p${ph}_d${di}_e${i}_w${week}`]).length;
  const nextDay=PHASES[ph].label+" "+(di<3?"Day "+(di+2):"— Rest then Day A");
  return(
    <div style={{position:"fixed",inset:0,zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.95)",padding:16}}>
      <div style={{width:"100%",maxWidth:400,background:C.card,borderRadius:16,padding:"24px 20px",border:`1px solid ${PHASES[ph].color}44`,maxHeight:"85vh",overflowY:"auto"}}>
        <div style={{textAlign:"center",marginBottom:20}}>
          <p style={{margin:0,fontSize:22,fontWeight:600,fontFamily:FD,color:PHASES[ph].color,letterSpacing:"0.02em",marginBottom:4}}>Session Complete</p>
          <p style={{margin:"4px 0 0",fontSize:12,color:C.muted,fontFamily:FB}}>Week {week} - {wo.label}</p>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          <div style={{flex:1,background:C.surface,borderRadius:10,padding:"12px",textAlign:"center",borderTop:`2px solid ${PHASES[ph].color}`}}>
            <p style={{margin:0,fontSize:11,color:C.muted,fontFamily:FC,letterSpacing:"0.1em"}}>EXERCISES</p>
            <p style={{margin:0,fontSize:22,fontFamily:FD,color:PHASES[ph].color}}>{doneCount}/{exercises.length}</p>
          </div>
          <div style={{flex:1,background:C.surface,borderRadius:10,padding:"12px",textAlign:"center",borderTop:`2px solid ${C.yellow}`}}>
            <p style={{margin:0,fontSize:11,color:C.muted,fontFamily:FC,letterSpacing:"0.1em"}}>VOLUME</p>
            <p style={{margin:0,fontSize:22,fontFamily:FD,color:C.yellow}}>
                  {totalVol>=1000?Math.round(totalVol/1000).toFixed(1)+"K":Math.round(totalVol)} lb
                </p>
          </div>
          <div style={{flex:1,background:C.surface,borderRadius:10,padding:"12px",textAlign:"center",borderTop:`2px solid ${C.red}`}}>
            <p style={{margin:0,fontSize:11,color:C.muted,fontFamily:FC,letterSpacing:"0.1em"}}>PRs</p>
            <p style={{margin:0,fontSize:22,fontFamily:FD,color:C.red}}>{PRs.length}</p>
          </div>
        </div>
        {week===1&&totalVol>0&&(
          <div style={{background:C.blue+"22",borderRadius:10,padding:"12px 14px",marginBottom:12,border:`1px solid ${C.blue}44`}}>
            <p style={{margin:"0 0 4px",fontSize:12,fontFamily:FD,color:C.blueBright,letterSpacing:"0.05em"}}>BASELINE SET</p>
            <p style={{margin:0,fontSize:12,color:C.muted,fontFamily:FB,lineHeight:1.5}}>Week 1 baselines locked in. Week 2 targets calculate automatically from today's weights. PRs start from Week 2.</p>
          </div>
        )}
        {PRs.length>0&&week>1&&(
          <div style={{background:C.yellow+"22",borderRadius:10,padding:"12px 14px",marginBottom:12,border:`1px solid ${C.yellow}44`}}>
            <p style={{margin:"0 0 8px",fontSize:12,fontFamily:FD,color:C.yellow,letterSpacing:"0.05em"}}>NEW PERSONAL RECORDS</p>
            {PRs.map((pr,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:i<PRs.length-1?`1px solid ${C.yellow}22`:"none"}}>
                <span style={{fontSize:12,color:C.text,fontFamily:FC}}>{pr.name}</span>
                <div style={{textAlign:"right"}}>
                  <span style={{fontSize:13,fontWeight:"bold",color:C.yellow,fontFamily:FC}}>{pr.rm}lb 1RM</span>
                  <span style={{fontSize:12,color:C.greenBright,fontFamily:FC,marginLeft:8}}>+{pr.gain}lb</span>
                </div>
              </div>
            ))}
          </div>
        )}
        <div style={{background:C.surface,borderRadius:10,padding:"10px 14px",marginBottom:16,border:`1px solid ${C.border}`}}>
          <p style={{margin:0,fontSize:12,color:C.muted,fontFamily:FB}}>Next: <span style={{color:C.text,fontWeight:"bold"}}>{nextDay}</span></p>
          {isDeload(week+1)&&<p style={{margin:"4px 0 0",fontSize:12,color:C.yellow,fontFamily:FB}}>Week {week+1} is a DELOAD week - 60% volume, same weights. Recovery is gains.</p>}
        </div>
        <button onClick={onClose}

          NICE WORK - DONE

  );
};

// ── BASELINE ASSESSMENT FLOW ───────────────────────────────────────────
const AssessmentFlow=({onComplete,onClose})=>{
  const [step,setStep]=useState(0);
  const [answers,setAnswers]=useState({});
  const q=ASSESSMENT_QUESTIONS[step];
  const choose=(v)=>{
    const next={...answers,[q.area]:v};
    setAnswers(next);
    if(step<ASSESSMENT_QUESTIONS.length-1) setStep(step+1);
    else{
      const priorities=Object.entries(next).sort((a,b)=>a[1]-b[1]).filter(([,v])=>v<=2).map(([area])=>area);
      const fallback=Object.entries(next).sort((a,b)=>a[1]-b[1]).slice(0,2).map(([area])=>area);
      onComplete({completedAt:new Date().toISOString(),answers:next,priorities:priorities.length?priorities:fallback});
    }
  };
  return(
    <div style={{position:"fixed",inset:0,zIndex:300,display:"flex",alignItems:"flex-end",background:"rgba(0,0,0,0.92)"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{width:"100%",maxWidth:430,margin:"0 auto",background:C.card,borderRadius:"16px 16px 0 0",padding:"24px 20px calc(40px + env(safe-area-inset-bottom))"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <p style={{margin:0,fontSize:12,color:C.muted,letterSpacing:"0.2em",fontFamily:FC}}>BASELINE ASSESSMENT · {step+1}/{ASSESSMENT_QUESTIONS.length}</p>
          <button onClick={onClose} style={{background:"none",border:"none",color:C.muted,fontSize:18,cursor:"pointer"}}>×</button>
        </div>
        <p style={{margin:"8px 0 4px",fontSize:22,fontFamily:FD,color:C.yellow}}>{q.label}</p>
        <p style={{margin:"0 0 18px",fontSize:13,color:C.text,fontFamily:FB,lineHeight:1.5}}>{q.prompt}</p>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {q.options.map(o=>(
            <button key={o.v} onClick={()=>choose(o.v)}
              style={{textAlign:"left",padding:"14px 16px",borderRadius:10,background:C.surface,border:`1px solid ${C.border}`,color:C.text,fontSize:13,fontFamily:FB,cursor:"pointer"}}>
              {o.l}
            </button>
          ))}
        </div>
        {step>0&&(
          <button onClick={()=>setStep(step-1)} style={{marginTop:12,background:"none",border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 14px",fontSize:12,color:C.steel,cursor:"pointer",fontFamily:FC}}>← BACK</button>
        )}
      </div>
    </div>
  );
};

const RoutineRunner=({routine,onComplete,onClose})=>{
  const [stepIdx,setStepIdx]=useState(0);
  const [timerKey,setTimerKey]=useState(0);
  const step=routine.steps[stepIdx];
  const isLast=stepIdx===routine.steps.length-1;

  return(

        <p style={{margin:"0 0 14px",fontSize:12,color:C.muted,fontFamily:FB,lineHeight:1.5}}>{step.note}</p>

  const persist=useCallback(nd=>{setData(nd);save(nd,pin);},[pin]);

  // Per-user baseline stats: stored data wins, then the USERS default.
  // Beaudy has no default (needsSetup) until she saves her own baselines.
  const baseStats=user.stats||null;
  const myStats=data.stats?{...(baseStats||{}),...data.stats}:baseStats;
  const needsSetup=!myStats;

  // ── Apple Health bridge: apply ─────────────────────────────────────
  // If a staged payload names THIS profile, merge it in (once — the
  // lastHealthSync stamp dedupes repeats). A payload for the other
  // profile is left staged, untouched. Reads fresh from storage rather
  // than the `data` closure so it can never clobber the seed/migration
  // effect's writes (or vice versa).
  const tryApplyHealth=()=>{
    const inbox=readHealthInbox();
    if(!inbox)return {status:"empty"};
    const p=inbox.payload;
    if(!p||typeof p.for!=="string"||p.for.toLowerCase()!==user.name.toLowerCase())return {status:"mismatch"};
    const fresh=load(pin);
    if(fresh.lastHealthSync===healthDedupeKey(p)){ clearHealthInbox(); return {status:"dup"}; }
    persist(mergeHealthPayload(fresh,p));
    clearHealthInbox();
    setHealthBanner(p);
    return {status:"applied",payload:p};
  };
  // Manual fallback (Track card): accept a full sync URL, a bare
  // base64url payload, or raw JSON — same validate → stage → apply path.
  const handleHealthPaste=()=>{
    const raw=healthPaste.trim();
    if(!raw){ setHealthPasteMsg("Paste a sync link, payload or JSON first."); return; }
    let obj=null;
    const hm=/#h=([A-Za-z0-9\-_]+)/.exec(raw);
    if(hm)obj=decodeHealthPayload(hm[1]);
    else if(raw.startsWith("{")){ try{obj=JSON.parse(raw);}catch(e){obj=null;} }
    else obj=decodeHealthPayload(raw);
    const p=obj?validateHealthPayload(obj):null;
    if(!p){ setHealthPasteMsg("That doesn't look like a Big Scary health payload — check the copy and try again."); return; }
    if(p.for.toLowerCase()!==user.name.toLowerCase()){ setHealthPasteMsg(`That payload is for ${p.for}.`); return; }
    stageHealthPayload(p);
    const res=tryApplyHealth();
    if(res.status==="applied"){ setHealthPaste(""); setHealthPasteMsg(`Synced ${isoToDisplay(p.date)} — weight, sleep, scans and Watch metrics filed for ${user.name}.`); }
    else if(res.status==="dup")setHealthPasteMsg("That sync is already applied — nothing new to file.");
    else setHealthPasteMsg("Couldn't apply that payload.");
  };
  // Latest Watch-metrics day (healthLog is kept iso-sorted by the merge).
  const healthLog=data.healthLog||[];
  const lastHealth=healthLog.length?healthLog[healthLog.length-1]:null;

  // Seed sensible default goals for a user who has never picked any.
  // A user who deliberately cleared their goals (goals === []) keeps [].
  // Also migrate legacy profiles to a per-user programStart, backdated
  // so the auto week stays exactly where the old global calendar put
  // it. A manual weekOverride still wins and is left untouched. Both
  // writes are merged into one persist so neither clobbers the other.
  useEffect(()=>{
    let nd=null;
    if(data.goals===undefined){
      nd={...(nd||data),goals:["build_muscle","get_stronger","move_better","front_split","vo2max"]};
    }
    if(!data.programStart&&!data.weekOverride){
      nd={...(nd||data),programStart:isoDaysAgo((calcCurrentWeek()-1)*7)};
    }
    // Gentle-deficit migration (Andrew only, one-time): if his saved
    // stats still hold BOTH untouched old recomp calorie defaults, move
    // them to the cut targets. Any other combination means he edited a
    // target himself in Track — leave his numbers alone. No other
    // profile's data is ever touched here.
    if(pin==="1111"&&myStats&&myStats.trainCal===2885&&myStats.restCal===2513){
      const mbase=nd||data;
      nd={...mbase,stats:{...(mbase.stats||{}),trainCal:2600,restCal:2250}};
    }
    if(nd)persist(nd);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  // Apple Health bridge: apply a staged payload for this profile on
  // mount — covers both an existing session at load and a fresh PIN
  // login (AppInner mounts in both cases). Runs after the seed effect
  // above and reads fresh storage, so the two never clobber each other.
  useEffect(()=>{
    tryApplyHealth();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  // The sync banner lives only on Train and clears when you leave it.
  useEffect(()=>{ if(tab!=="workout")setHealthBanner(null); },[tab]);

  // ── Goals ──────────────────────────────────────────────────────────────
  const goals=data.goals||[];
  const goalTags=goals.flatMap(gid=>(GOALS.find(g=>g.id===gid)?.tags)||[]);
  const toggleGoal=(gid)=>{
    const next=goals.includes(gid)?goals.filter(g=>g!==gid):[...goals,gid];
    persist({...data,goals:next});
  };

  // ── Assessment ─────────────────────────────────────────────────────────
  const assessment=data.assessment||null;
  const completeAssessment=(result)=>{persist({...data,assessment:result});setAssessmentOpen(false);};

  // ── Mobility routine log ───────────────────────────────────────────────
  const mobilityLog=data.mobilityLog||[];
  const completeRoutine=(routine)=>{
    persist({...data,mobilityLog:[...mobilityLog,{date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),routineId:routine.id,title:routine.title,ts:Date.now()}]});
    setRunningRoutine(null);
  };

  // ── Conditioning (VO2max) log ──────────────────────────────────────────
  const conditioningLog=data.conditioningLog||[];
  const completeConditioning=(session)=>{
    setRunningConditioning(null);
    setPendingConditioningRPE(session);
  };
  const logConditioningRPE=(rpe)=>{
    const session=pendingConditioningRPE;
    persist({...data,conditioningLog:[...conditioningLog,{date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),sessionId:session.id,title:session.title,week:currentWeek,rpe,ts:Date.now()}]});
    setPendingConditioningRPE(null);
  };
  // Trend of logged effort for the Norwegian 4x4 specifically -- the
  // deload-week checkpoint for "is VO2max actually improving" is simpler
  // than a lab test: the same protocol should start feeling easier at the
  // same RPE, or the same RPE should correspond to more rounds completed.
  const norwegian4x4History=conditioningLog.filter(c=>c.sessionId==="norwegian_4x4"&&c.rpe!=null);
  const lastConditioningRPE=norwegian4x4History[norwegian4x4History.length-1];

  // ── Skills ─────────────────────────────────────────────────────────────
  const skillState=data.skills||{};
  const getSkill=(sid)=>skillState[sid]||{level:0,log:[]};
  const advanceSkillLevel=(sid)=>{
    const s=getSkill(sid);
    const max=SKILLS.find(sk=>sk.id===sid).levels.length-1;
    if(s.level>=max)return;
    persist({...data,skills:{...skillState,[sid]:{...s,level:s.level+1}}});
  };
  const regressSkillLevel=(sid)=>{
    const s=getSkill(sid);
    if(s.level<=0)return;
    persist({...data,skills:{...skillState,[sid]:{...s,level:s.level-1}}});
  };
  // Two-tap confirm for advancing a skill level: first tap arms the button
  // for 3 seconds, second tap actually advances. Prevents accidental taps
  // permanently levelling a skill with no way back.
  const handleAdvanceSkill=(sk)=>{
    if(armedSkill!==sk.id){
      setArmedSkill(sk.id);
      clearTimeout(armTimerRef.current);
      armTimerRef.current=setTimeout(()=>setArmedSkill(null),3000);
      return;
    }
    clearTimeout(armTimerRef.current);
    setArmedSkill(null);
    advanceSkillLevel(sk.id);
  };
  const logSkillPractice=(sid)=>{
    const draft=skillLogDraft[sid]||{};
    if(!draft.hold&&!draft.note)return;
    const s=getSkill(sid);
    const entry={date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),holdSeconds:draft.hold||"",note:draft.note||"",ts:Date.now()};
    persist({...data,skills:{...skillState,[sid]:{...s,log:[...(s.log||[]),entry]}}});
    setSkillLogDraft({...skillLogDraft,[sid]:{hold:"",note:""}});
  };

  // Auto week: manual override wins, then this profile's own program
  // start date, then the legacy global calendar.
  const autoWeek=calcCurrentWeek();
  const currentWeek=data.weekOverride||weekFromStart(data.programStart)||autoWeek;
  const ph=phaseFromWeek(currentWeek);
  const deload=isDeload(currentWeek);
  const pc=PHASES[ph].color;
  const wo=WO[ph][di];
  const stepWeek=(delta)=>{
    const next=Math.max(1,Math.min(12,currentWeek+delta));
    if(next===currentWeek){
      setWeekMsg(delta>0?"You're at the current week":"You're at Week 1");
    } else {
      setWeekMsg("");
      persist({...data,weekOverride:next});
    }
  };
  // Restart the program at Week 1: clears every week's exercise logs,
  // completion flags, session notes and the conditioning log. Body
  // tracking (baselines, weight, scans, measurements) and skill levels
  // are kept. Two-tap confirm, same pattern as skill advance.
  const resetProgram=()=>{
    if(!resetArm){
      setResetArm(true);
      if(resetTimerRef.current)clearTimeout(resetTimerRef.current);
      resetTimerRef.current=setTimeout(()=>setResetArm(false),3000);
      return;
    }
    if(resetTimerRef.current)clearTimeout(resetTimerRef.current);
    setResetArm(false);
    const nd={...data};
    Object.keys(nd).forEach(k=>{
      if(/^p\d+_d\d+_e\d+_w\d+$/.test(k)||/^done_p\d+_d\d+_e\d+_w\d+$/.test(k))delete nd[k];
    });
    nd.sessionNotes={};
    nd.conditioningLog=[];
    delete nd.weekOverride;
    nd.programStart=isoToday();
    persist(nd);
    setTab("train");
  };
  // 60-minute mode: persisted per user, default ON. Core exercises render
  // first; opt exercises collapse under "IF YOU HAVE TIME".
  const sixtyMinMode=data.sixtyMinMode!==false;
  const estMinsFor=(list)=>Math.max(10,Math.round((7+list.reduce((s,e)=>s+(e.s||1)*(isCompound(e.n)?2.2:1.6),0))/5)*5);
  const condStepDur=(txt,fallback)=>{
    const m=/(\d+)/.exec(txt||"");
    return m?parseInt(m[1])*60:(fallback||300);
  };

  // Keys
  const SK2=(p,d,e)=>`p${p}_d${d}_e${e}`;
  const DK=(p,d,e,w)=>`done_p${p}_d${d}_e${e}_w${w||currentWeek}`;
  const WK=(p,d,e,w)=>`p${p}_d${d}_e${e}_w${w}`;
  const getLast=ei=>data[SK2(ph,di,ei)];
  const isDone=ei=>!!data[DK(ph,di,ei,currentWeek)];
  const getHistory=ei=>Array.from({length:currentWeek-1},(_,i)=>data[WK(ph,di,ei,i+1)]||null).filter(Boolean);

  // ── Smart Coaching ───────────────────────────────────────────────
  // Readiness: blends last night's sleep, the recent sleep average and
  // recent conditioning load into a 0-100 score plus a target
  // multiplier. Formula: base 70, +(lastNight-7h)*10 (clamped ±20),
  // +(sleepAvg-7h)*5 (clamped ±10), -(recentRPE-7)*3 when the last 3
  // days of conditioning averaged above RPE 7 (clamped -15..0), total
  // clamped 5..100. No sleep logged at all → null (fully neutral).
  // v2: synced HRV/resting-HR deviations vs the lifter's own averages
  // are added before the final clamp (see healthReadinessComps).
  const readinessInfo=(()=>{
    const wl=(data.wlog||[]).filter(e=>parseFloat(e.sleep)>0);
    if(!wl.length)return null;
    const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));
    const lastNight=parseFloat(wl[wl.length-1].sleep);
    const last7=wl.slice(-7);
    const sleepAvg=last7.reduce((s,e)=>s+parseFloat(e.sleep),0)/last7.length;
    const nowMs=Date.now();
    const recent=(data.conditioningLog||[]).filter(c=>c.rpe!=null&&c.ts&&(nowMs-c.ts)<=3*24*3600*1000);
    const recentLoad=recent.length?recent.reduce((s,c)=>s+parseFloat(c.rpe),0)/recent.length:null;
    let score=70+clampN((lastNight-7)*10,-20,20)+clampN((sleepAvg-7)*5,-10,10);
    if(recentLoad!==null&&recentLoad>7)score+=clampN(-(recentLoad-7)*3,-15,0);
    // Readiness v2 (Health bridge): HRV / resting-HR deviations from the
    // lifter's own averages. healthReadinessComps returns zeros and an
    // empty why without fresh healthLog data, so the score above is
    // unchanged for anyone not syncing from a Watch.
    const hComps=healthReadinessComps(data.healthLog);
    score+=hComps.hrvComp+hComps.rhrComp;
    score=Math.round(clampN(score,5,100));
    const factor=score>=90?1.02:score>=80?1:score>=65?0.97:0.94;
    const label=score>=90?"Primed":score>=80?"Ready":score>=65?"Flat":"Low";
    return {score,factor,label,lastNight,sleepAvg,sleepNights:last7.length,recentLoad,why:hComps.why};
  })();
  // Weight trend: needs 6+ weigh-ins spanning 10+ days. Compares the
  // mean of the latest 3 entries against the 3 before them; the time
  // between the two groups' mean timestamps converts the change into
  // a per-week rate. Entries carry ts (saveWeight and CSV import both
  // set it); a date-string parse is the fallback.
  const weightTrend=(()=>{
    const wl=(data.wlog||[]).filter(e=>parseFloat(e.w)>0);
    if(wl.length<6)return null;
    const tOf=e=>e.ts||new Date(e.date).getTime()||0;
    const sorted=[...wl].sort((a,b)=>tOf(a)-tOf(b));
    const spanDays=(tOf(sorted[sorted.length-1])-tOf(sorted[0]))/86400000;
    if(spanDays<10)return null;
    const meanW=a=>a.reduce((s,e)=>s+parseFloat(e.w),0)/a.length;
    const meanT=a=>a.reduce((s,e)=>s+tOf(e),0)/a.length;
    const prior=sorted.slice(-6,-3),recent=sorted.slice(-3);
    const weeks=(meanT(recent)-meanT(prior))/(7*86400000);
    if(!(weeks>0))return null;
    return {rate:(meanW(recent)-meanW(prior))/weeks,spanDays:Math.round(spanDays),count:wl.length};
  })();

  const getTargets=ei=>{
    const last=getLast(ei);
    if(!last)return null;
    // Full per-week history for personal-pace learning: prior weeks
    // oldest→newest, with the latest sets appended — unless the final
    // history entry already IS those sets (same content, when last
    // week's save also lives under its WK key).
    const hist=getHistory(ei);
    const fullHist=(hist.length&&JSON.stringify(hist[hist.length-1])===JSON.stringify(last))?hist:[...hist,last];
    return calcTarget(last,WO[ph][di].ex[ei],currentWeek,ph,{history:fullHist,readiness:readinessInfo});
  };

  // Plateau flags: exercises in the current phase whose last two logged
  // weeks BOTH missed the hit rule (every work set at target reps with
  // RIR <= 1). Surfaced in the deload Week Progress Check card.
  const stalledExercises=(()=>{
    const names=[];
    WO[ph].forEach((day,d2)=>{
      day.ex.forEach((ex,e2)=>{
        const loggedWeeks=[];
        for(let w=1;w<=currentWeek;w++){ if(data[WK(ph,d2,e2,w)]) loggedWeeks.push(w); }
        if(loggedWeeks.length<2)return;
        const tgt=typeof ex.r==="number"?ex.r:parseInt(ex.r)||10;
        const missedWeek=(w)=>{
          const sets=(data[WK(ph,d2,e2,w)]||[]).filter(s=>!s.isWarmup&&!s.isBurnout);
          if(!sets.length)return false;
          return !sets.every(s=>{
            const reps=parseInt(s.r)||0;
            const rir=parseInt(s.rir);
            return reps>=tgt&&(isNaN(rir)||rir<=1);
          });
        };
        if(loggedWeeks.slice(-2).every(missedWeek)) names.push(ex.n);
      });
    });
    return names;
  })();

  const nextExIdx=(fromIdx,src)=>{
    const exs=WO[ph][di].ex;
    for(let j=fromIdx+1;j<exs.length;j++){
      if(sixtyMinMode&&exs[j].opt)continue;
      if(src[DK(ph,di,j,currentWeek)])continue;
      return j;
    }
    return -1;
  };

  const saveLog=(ei,sets,note)=>{
    const nd={...data,
      [SK2(ph,di,ei)]:sets,
      [DK(ph,di,ei,currentWeek)]:true,
      [WK(ph,di,ei,currentWeek)]:sets,
    };
    if(note){
      const notes=nd.sessionNotes||{};
      notes[`${ph}_${di}_w${currentWeek}`]=note;
      nd.sessionNotes=notes;
    }
    persist(nd);
    // Advance straight into the next unlogged exercise; only close when none remain
    const nx=nextExIdx(ei,nd);
    if(nx>=0){
      setLm(nx);
    } else {
      setLm(null);
      // Check if all exercises done
      const allDone=WO[ph][di].ex.every((ex,i)=>(sixtyMinMode&&ex.opt)||i===ei||!!nd[DK(ph,di,i,currentWeek)]);
      if(allDone)setSessionDone(true);
    }
  };

  // Daily supplement checklist
  const today=new Date().toDateString();
  const isTrainingToday=TRAINING_DAYS_OF_WEEK.includes(new Date().getDay());
  const todaySupps=DAILY_SUPPS.filter(s=>!s.trainOnly||isTrainingToday);
  const suppKey=`supps_${today}`;
  const checkedSupps=data[suppKey]||{};
  const toggleSupp=(id)=>{
    const ns={...checkedSupps,[id]:!checkedSupps[id]};
    persist({...data,[suppKey]:ns});
  };
  const suppDoneCount=Object.values(checkedSupps).filter(Boolean).length;

  // Scan / weight save
  const saveScan=()=>{
    if(!scanW)return;
    const scans=data.scans||[];
    persist({...data,scans:[...scans,{date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),w:scanW,bf:scanBF,m:scanM,n:scanN,ts:Date.now()}]});
    setScanW("");setScanBF("");setScanM("");setScanN("");
  };
  const saveWeight=()=>{
    if(!logW)return;
    const wlog=data.wlog||[];
    persist({...data,wlog:[...wlog,{date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),w:logW,sleep:logSleep,n:logN,ts:Date.now()}]});
    setLogW("");setLogSleep("");setLogN("");
  };
  const saveMeasurements=()=>{
    if(!mWaist&&!mChest&&!mRArm)return;
    const ms=data.measurements||[];
    persist({...data,measurements:[...ms,{date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),waist:mWaist,chest:mChest,rarm:mRArm,larm:mLArm,shoulder:mShould,n:mNote,ts:Date.now()}]});
    setMWaist("");setMChest("");setMRArm("");setMLArm("");setMShould("");setMNote("");
  };

  // Per-user baselines editor (Track). Saving stores the active user's own
  // stats under their own key — this is how Beaudy gets her own numbers.
  const baseVals=baseForm||{
    weight:myStats?.weight??"",bf:myStats?.bf??"",bfGoal:myStats?.bfGoal??"",muscle:myStats?.muscle??"",
    benchC:myStats?.prs?.bench.c??"",benchT:myStats?.prs?.bench.t??"",
    squatC:myStats?.prs?.squat.c??"",squatT:myStats?.prs?.squat.t??"",
    dlC:myStats?.prs?.deadlift.c??"",dlT:myStats?.prs?.deadlift.t??"",
    trainCal:myStats?.trainCal??"",restCal:myStats?.restCal??"",
  };
  const saveBaselines=()=>{
    const b=baseVals;
    const stats={
      weight:parseFloat(b.weight)||0,bf:parseFloat(b.bf)||0,bfGoal:parseFloat(b.bfGoal)||0,muscle:parseFloat(b.muscle)||0,
      prs:{bench:{c:parseFloat(b.benchC)||0,t:parseFloat(b.benchT)||0},
           squat:{c:parseFloat(b.squatC)||0,t:parseFloat(b.squatT)||0},
           deadlift:{c:parseFloat(b.dlC)||0,t:parseFloat(b.dlT)||0}},
      trainCal:parseInt(b.trainCal)||0,restCal:parseInt(b.restCal)||0,
      journey:myStats?.journey||[parseFloat(b.bf)||0,parseFloat(b.bf)||0,parseFloat(b.bf)||0,parseFloat(b.bfGoal)||0],
    };
    persist({...data,stats});
    setBaseForm(null);
  };
  // Calorie coach (Smart Coaching): the weight-trend suggestion in
  // Fuel stores a flat adjustment here. Applying sets the value (it
  // never stacks); 0 clears it. Fuel adds it to both calorie targets.
  const applyCalAdjust=(v)=>persist({...data,calAdjust:v});

  // Export all locally-stored training data as a JSON file, for migrating
  // into the new Supabase-backed platform. Purely additive/read-only:
  // downloads a snapshot, never modifies `data`.
  const exportData=()=>{
    const payload={exportedAt:new Date().toISOString(),pin,userName:user.name,data};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`bigscary-export-${user.name.toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // Import: restore a full profile from this app's own export file (the
  // export wraps the profile in a top-level "data" key — unwrap it).
  // Selecting a file only stages it; nothing is applied until the
  // two-tap confirm replaces the profile via persist.
  const IMPORT_KNOWN_KEYS=["wlog","scans","skills","weekOverride","programStart","conditioningLog","stats","measurements","goals","assessment"];
  const handleJsonFile=(e)=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const parsed=JSON.parse(reader.result);
        const candidate=(parsed&&typeof parsed==="object"&&!Array.isArray(parsed)&&parsed.data&&typeof parsed.data==="object"&&!Array.isArray(parsed.data))?parsed.data:parsed;
        if(!candidate||typeof candidate!=="object"||Array.isArray(candidate))throw new Error("bad shape");
        if(!IMPORT_KNOWN_KEYS.some(k=>k in candidate))throw new Error("no known keys");
        setPendingImport(candidate);
        setImportArm(false);
        setImportMsg(`Loaded ${file.name} — tap the button below to replace ALL of ${user.name}'s data with it.`);
      }catch(err){
        setPendingImport(null);
        setImportArm(false);
        setImportMsg("That file doesn't look like a Big & Scary export — nothing was imported.");
      }
    };
    reader.readAsText(file);
  };
  const confirmImport=()=>{
    if(!pendingImport)return;
    if(!importArm){
      setImportArm(true);
      if(importTimerRef.current)clearTimeout(importTimerRef.current);
      importTimerRef.current=setTimeout(()=>setImportArm(false),3000);
      return;
    }
    if(importTimerRef.current)clearTimeout(importTimerRef.current);
    const nd=pendingImport;
    setPendingImport(null);
    setImportArm(false);
    setImportMsg("Import complete — this profile's data was replaced with the file's contents.");
    persist(nd);
  };
  // Weight/sleep CSV import: tolerant header (date, weight, sleep in any
  // order; header optional if the first row parses as a date). Merges
  // into wlog keyed by the app's own date string ("Nov 14, 2026") —
  // same-date entries are replaced, new ones appended, order kept
  // chronological by timestamp.
  const handleCsvFile=(e)=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      const lines=String(reader.result||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      const parseCsvDate=(s)=>{
        if(!s)return null;
        const t=s.trim();
        const iso=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t);
        if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]);
        const us=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(t);
        if(us)return new Date(+us[3],+us[1]-1,+us[2]);
        const d=new Date(t);
        return isNaN(d)?null:d;
      };
      let di=0,wi=1,si=-1,start=0;
      if(lines.length){
        const head=lines[0].toLowerCase().split(",").map(h=>h.trim());
        const dIdx=head.findIndex(h=>/date|day/.test(h));
        const wIdx=head.findIndex(h=>/weight|wt|lb/.test(h));
        const sIdx=head.findIndex(h=>/sleep/.test(h));
        if(dIdx>=0||wIdx>=0){
          if(dIdx>=0)di=dIdx;
          if(wIdx>=0)wi=wIdx;
          si=sIdx;
          start=1;
        }
      }
      const byDate={};
      (data.wlog||[]).forEach(en=>{byDate[en.date]=en;});
      let count=0;
      for(let i=start;i<lines.length;i++){
        const cols=lines[i].split(",").map(c=>c.trim());
        const d=parseCsvDate(cols[di]);
        const w=parseFloat(cols[wi]);
        if(!d||isNaN(w))continue;
        const dateStr=d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
        const prev=byDate[dateStr];
        const sleepVal=(si>=0&&cols[si])?cols[si]:(prev?prev.sleep||"":"");
        byDate[dateStr]={date:dateStr,w:String(w),sleep:sleepVal,n:prev?prev.n||"":"",ts:d.getTime()};
        count++;
      }
      if(count===0){setImportMsg("No usable rows found in that CSV — nothing was imported.");return;}
      const merged=Object.values(byDate).sort((a,b)=>(a.ts||0)-(b.ts||0));
      persist({...data,wlog:merged});
      setImportMsg(`Imported ${count} entries into your weight + sleep log.`);
    };
    reader.readAsText(file);
  };

  // ── Progress charts (Track) ────────────────────────────────────────
  // Strength trends: best estimated 1RM (Epley) per exercise name per
  // week, scanned from the raw weekly log keys.
  const strengthTrends=(()=>{
    const byName={};
    Object.keys(data).forEach(k=>{
      const m=/^p(\d+)_d(\d+)_e(\d+)_w(\d+)$/.exec(k);
      if(!m)return;
      const p2=+m[1],d2=+m[2],e2=+m[3],w2=+m[4];
      const exDef=WO[p2]&&WO[p2][d2]&&WO[p2][d2].ex[e2];
      if(!exDef)return;
      let best=0;
      (data[k]||[]).filter(s=>!s.isWarmup&&!s.isBurnout).forEach(s=>{
        const w=parseFloat(s.w),r=parseInt(s.r);
        if(w>0&&r>0)best=Math.max(best,w*(1+r/30));
      });
      if(best<=0)return;
      if(!byName[exDef.n])byName[exDef.n]={};
      byName[exDef.n][w2]=Math.max(byName[exDef.n][w2]||0,best);
    });
    return Object.entries(byName)
      .map(([name,weeks])=>{
        const ws=Object.keys(weeks).map(Number).sort((a,b)=>a-b);
        if(ws.length<2)return null;
        const series=ws.map(w=>({w,v:Math.round(weeks[w])}));
        const first=series[0].v,latest=series[series.length-1].v;
        // Strength projection (Smart Coaching): least-squares slope of
        // weekly best e1RM vs week number (needs 3+ points), and for
        // the big three an ETA to the lifter's 1RM goal at that pace.
        let slope=null,proj=null;
        if(series.length>=3){
          const nPts=series.length;
          const mx=series.reduce((s,p)=>s+p.w,0)/nPts;
          const my=series.reduce((s,p)=>s+p.v,0)/nPts;
          let num=0,den=0;
          series.forEach(p=>{num+=(p.w-mx)*(p.v-my);den+=(p.w-mx)*(p.w-mx);});
          slope=den?num/den:null;
          const goalKey=/deadlift/i.test(name)?"deadlift":/bench/i.test(name)?"bench":/squat/i.test(name)?"squat":null;
          const goal=goalKey&&myStats&&myStats.prs&&myStats.prs[goalKey]?(parseFloat(myStats.prs[goalKey].t)||0):0;
          if(slope!==null&&slope>0.2&&goal>0&&latest<goal){
            const eta=Math.ceil(currentWeek+(goal-latest)/slope);
            proj={goal,eta:eta>24?null:eta};
          }
        }
        return {name,series,first,latest,delta:first?((latest-first)/first)*100:0,lastWeek:ws[ws.length-1],slope,proj};
      })
      .filter(Boolean)
      .sort((a,b)=>b.lastWeek-a.lastWeek)
      .slice(0,6);
  })();
  // Adherence per week: done flags vs total exercises in that week's
  // phase. Null when nothing has ever been completed.
  const adherenceRows=(()=>{
    const anyDone=Object.keys(data).some(k=>/^done_p\d+_d\d+_e\d+_w\d+$/.test(k)&&data[k]);
    if(!anyDone)return null;
    const rows=[];
    for(let w=1;w<=currentWeek;w++){
      const p2=phaseFromWeek(w);
      const total=WO[p2].reduce((sum,day)=>sum+day.ex.length,0);
      let done=0;
      WO[p2].forEach((day,d2)=>{day.ex.forEach((ex,e2)=>{if(data[`done_p${p2}_d${d2}_e${e2}_w${w}`])done++;});});
      rows.push({w,pct:total?Math.round(done/total*100):0});
    }
    return rows;
  })();
  const adherence=adherenceRows?adherenceRows.slice(-6):null;
  const thisWeekAdherence=adherenceRows?((adherenceRows.find(r=>r.w===currentWeek)||{}).pct??null):null;
  // Smart Coach aggregates: how many current-phase lifts run on a
  // learned personal pace (same history assembly as getTargets), and
  // the fastest-progressing charted lift by e1RM slope.
  const personalPaceCount=(()=>{
    let n=0;
    WO[ph].forEach((day,d2)=>{
      day.ex.forEach((ex,e2)=>{
        const hist=[];
        for(let w=1;w<currentWeek;w++){ if(data[WK(ph,d2,e2,w)]) hist.push(data[WK(ph,d2,e2,w)]); }
        const last=data[SK2(ph,d2,e2)];
        if(last&&(!hist.length||JSON.stringify(hist[hist.length-1])!==JSON.stringify(last)))hist.push(last);
        if(personalIncrement(hist,ex)!==null)n++;
      });
    });
    return n;
  })();
  const fastestLift=(()=>{
    const cand=strengthTrends.filter(t=>t.slope!==null&&t.slope>0);
    return cand.length?cand.reduce((a,b)=>b.slope>a.slope?b:a):null;
  })();

  const scans=data.scans||[];
  const lastScan=scans[scans.length-1];
  const bfStart=myStats?myStats.bf:11.6;
  const bfGoal=myStats?myStats.bfGoal:8.5;
  const curBF=lastScan&&parseFloat(lastScan.bf)?parseFloat(lastScan.bf):bfStart;
  const bfProg=myStats?Math.max(0,Math.min(1,(bfStart-curBF)/((bfStart-bfGoal)||1))):0;

  // Mobility recommendations: union of assessment priority areas + goal tags.
  // Just a filter over the library, not a separate scoring engine.
  const priorityTags=assessment?.priorities||[];
  const recommendTags=[...new Set([...priorityTags,...goalTags])];
  const recommendedRoutines=recommendTags.length
    ? MOBILITY_LIBRARY.filter(r=>r.tags.some(t=>recommendTags.includes(t))).slice(0,3)
    : [];
  const mobilityByDomain=MOBILITY_DOMAINS.map(d=>({...d,routines:MOBILITY_LIBRARY.filter(r=>r.domain===d.id)}));
  const sortedSkills=[...SKILLS].sort((a,b)=>{
    const aMatch=a.tags.some(t=>goalTags.includes(t))?0:1;
    const bMatch=b.tags.some(t=>goalTags.includes(t))?0:1;
    return aMatch-bMatch;
  });

  // NAV
  const NAV=[
    {id:"workout",ic:"dumbbell",lb:"Train"},
    {id:"meals",  ic:"meals",   lb:"Fuel"},
    {id:"daily",  ic:"daily",   lb:"Daily"},
    {id:"track",  ic:"track",   lb:"Track"},
    {id:"skills", ic:"trophy",  lb:"Skills"},
  ];

  // Meal plan - auto-syncs to current phase
  const mpBase=MEALS.find(m=>m.ph===ph&&m.dt===mealDt)||MEALS[0];
  // DAILY_SUPPS is the single source of truth for supplements: Fuel derives
  // each meal's supplement chips from it (grouped by time of day), so Fuel
  // and Daily can never disagree. Training-only items appear on training
  // days only, exactly as scheduled.
  const suppsForMeal=(times)=>DAILY_SUPPS.filter(s=>times.includes(s.time)&&(!s.trainOnly||mealDt==="training")).map(s=>s.name);
  // Per-user nutrition: the MEALS plans are a shared template, so scale
  // the displayed portions to this user's own calorie target. Item
  // description text stays as written — amounts in text are guides.
  // Macro targets come from USERS stats, keyed by PIN — never from
  // saved myStats, so they can only ever apply to a profile whose
  // defaults define them (Andrew's gentle cut). With macro targets,
  // each macro scales by its own factor (protein holds while carbs and
  // fat absorb the deficit) and the header shows the target macros
  // exactly. Without them, fP/fC/fF all equal fuelFactor and the gate
  // reduces to fuelScaled — the original single-factor path, unchanged.
  const calAdjust=myStats?(parseInt(data.calAdjust)||0):0;
  const aboveBfGoal=myStats?(parseFloat(myStats.bf)||0)>(parseFloat(myStats.bfGoal)||0):false;
  const fuelTargetCal=myStats?(mealDt==="training"?((myStats.trainCal||mpBase.cal)+calAdjust):((myStats.restCal||mpBase.cal)+calAdjust)):mpBase.cal;
  const fuelFactor=(myStats&&fuelTargetCal>0&&mpBase.cal>0)?fuelTargetCal/mpBase.cal:1;
  const fuelScaled=Math.abs(fuelFactor-1)>=0.02;
  const macroTargets=(USERS[pin]&&USERS[pin].stats)?(mealDt==="training"?USERS[pin].stats.trainMacros:USERS[pin].stats.restMacros)||null:null;
  const fP=macroTargets?macroTargets.p/mpBase.p:fuelFactor;
  const fC=macroTargets?macroTargets.c/mpBase.c:fuelFactor;
  const fF=macroTargets?macroTargets.f/mpBase.f:fuelFactor;
  const fuelActive=fuelScaled||(macroTargets!=null&&(Math.abs(fP-1)>=0.02||Math.abs(fC-1)>=0.02||Math.abs(fF-1)>=0.02));
  const scaleSection=(sec)=>fuelActive?{...sec,items:sec.items.map(it=>({...it,
    cal:Math.round(it.cal*fuelFactor/5)*5,
    p:Math.round(it.p*fP),
    c:Math.round(it.c*fC),
    f:Math.round(it.f*fF)}))}:sec;
  const mp={...mpBase,
    cal:fuelTargetCal,
    p:macroTargets?macroTargets.p:(fuelScaled?Math.round(mpBase.p*fuelFactor):mpBase.p),
    c:macroTargets?macroTargets.c:(fuelScaled?Math.round(mpBase.c*fuelFactor):mpBase.c),
    f:macroTargets?macroTargets.f:(fuelScaled?Math.round(mpBase.f*fuelFactor):mpBase.f),
    bkfst:{...scaleSection(mpBase.bkfst),supps:suppsForMeal(["5:20 AM","6:40 AM","Breakfast"])},
    lunch:{...scaleSection(mpBase.lunch),supps:suppsForMeal(["Lunch","Daily"])},
    dinner:{...scaleSection(mpBase.dinner),supps:suppsForMeal(["Dinner","9:30 PM"])}};

  // SUPPS DATA (inline for brevity)
  const SUPPS_XS=[

     dose:"1 serving 20-30 min before training",why:"Clinical doses. The tingling from beta-alanine is normal."},
