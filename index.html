     dose:"Mix with water or shake within 30 min.",why:"Glucosamine + Turmeric directly targets your AC joint and patellar tendinitis."},
    {name:"XS Ignite Powder",timing:"Daily - morning or pre-cardio",caff:0,color:C.orange,
     ingredients:["400mg Morosil Moro Blood Orange (clinically proven fat loss)","2g Isomaltulose (low-GI sustained energy)","200mg L-Glutamine","Vitamin E (antioxidant)","15 cal, 3g carbs, zero caffeine"],
     dose:"1 sachet daily.",why:"Zero caffeine fat burner. Moro blood orange is one of few ingredients with real human trial data."},
    {name:"XS Premade Shakes",timing:"Meal 3 or snack",caff:0,color:C.red,
     ingredients:["25g protein (Whey + Casein blend)","Casein = slow digesting, keeps you full","1g sugar, Inulin prebiotic fiber","Vitamin C from Acerola"],
     dose:"Snack or meal replacement.",why:"Casein component ideal between meals. Inulin feeds good gut bacteria."},
    {name:"XS Energy Drink",timing:"Phase-restricted - see Caffeine",caff:114,color:C.orange,
     ingredients:["114mg natural caffeine per can","Taurine, L-Glutamine","B3 Niacinamide, B5, B6 Pyridoxine, B12 Cyanocobalamin","Folic Acid, Vitamin C","Zero sugar, 15 cal"],
     dose:"Phase 1: CUT. Phase 2: training days before noon. Phase 3: rest days before 11am.",why:"Never daily. 114mg on top of poor sleep spikes cortisol."},
  ];
  const SUPPS_NUT=[
    {name:"Perfect Pack",timing:"AM packet breakfast / PM packet dinner",caff:0,color:C.green,
     ingredients:["Double X: 12 vitamins (A,C,D,E,K,B1-B12)","Double X: 10 minerals (Ca,Mg,Zn,Se + more)","22 plant concentrates - PhytoProtect blend","Concentrated Fruits & Veg: equiv 5+ servings","Advanced Omega: 1000mg+ EPA+DHA+ALA","Vitamin D: 50mcg mushroom-derived D3"],
     dose:"AM packet with breakfast. PM packet with dinner.",why:"Your micronutrient foundation. Omega-3s directly support shoulder and knee joints."},
    {name:"Liver Health",timing:"With breakfast + lunch (2x daily)",caff:0,color:C.green,
     ingredients:["Milk Thistle 167mg (Silymarin - liver antioxidant)","Dandelion root (bile flow, liver function)","Turmeric 85% curcuminoids","Acerola Vitamin C","B1, B2, B3, B5, B6, B12"],
     dose:"1 tablet twice daily with meals.",why:"Supports fat metabolism in deficit. Milk Thistle protects liver from oxidative stress."},
    {name:"Rhodiola",timing:"With breakfast daily",caff:0,color:C.green,
     ingredients:["Rhodiola rosea 100mg (Rosavin, Salidroside, Tyrosol)","Vitamin C 30mg from Acerola","Spinach dehydrate 50mg (Glutathione)","Note: Pre-Workout also has 100mg Rhodiola"],
     dose:"1 tablet with breakfast.",why:"Adaptogen - lowers cortisol, improves sleep quality. CRITICAL given 5-6hr sleep."},
    {name:"Lion's Mane",timing:"With breakfast daily",caff:0,color:C.purple,
     ingredients:["Hericium erinaceus mushroom extract","Hericenones + Erinacines (stimulate NGF)","Beta-glucans (immune support)"],
     dose:"With breakfast daily.",why:"Supports brain health and nervous system. Focus at 5am and recovery nervous system."},
    {name:"CLA 500",timing:"With lunch + dinner",caff:0,color:C.green,
     ingredients:["Conjugated Linoleic Acid 500mg per softgel","Derived from 100% safflower oil","Tocopherols (Vitamin E) as antioxidant"],
     dose:"2 softgels lunch, 2 softgels dinner. Needs dietary fat.",why:"Reduces body fat AND supports lean muscle retention. Must take with fat-containing meals."},
    {name:"Nutrilite Organics Turmeric",timing:"With lunch or dinner",caff:0,color:C.orange,
     ingredients:["Turmeric extract 400mg - USDA Certified Organic","45x better absorbed than standard turmeric","Equiv to 6,000mg standard turmeric","Standardized for curcuminoids"],
     dose:"1-2 capsules with largest fat-containing meal.",why:"Directly targets AC joint and patellar tendinitis. The 45x absorption advantage is real."},
    {name:"Vision Health",timing:"With dinner",caff:0,color:C.green,
     ingredients:["Lutein 15mg from Marigold flowers","Zeaxanthin 3mg from Marigold","Lycopene from Tomatoes","Beta-Carotene from Algae","Bilberry + Black Currant anthocyanins","Spinach concentrate"],
     dose:"2 softgels with dinner.",why:"Fat-soluble - absorbs best with your largest fat-containing meal."},
    {name:"Carb Blocker",timing:"CHEAT MEALS ONLY",caff:0,color:C.muted,
     ingredients:["White Kidney Bean extract 500mg (blocks complex carbs)","Fermented Soybean extract 300mg (blocks sugars)","May prevent up to 500 cal absorption per meal"],
     dose:"2-3 tablets at START of cheat meal only.",why:"NEVER on regular training meals. Use only for high-carb off-plan meals. Never more than once a week."},
  ];
  const CAFF_PHASES=[
    {ph:0,label:"Phase 1",weeks:"Wks 1-4",color:C.blue,total:"115mg",
     items:[{name:"XS Pre-Workout",mg:115,status:"on",time:"5:20 AM"},{name:"Coffee",mg:100,status:"cut",time:"Cut completely"},{name:"XS Energy Drink",mg:114,status:"cut",time:"Cut completely"}],
     goal:"Clean baseline. Cortisol reset. Assess sleep.",
     note:"Cortisol peaks at 5am. Coffee on top of pre-workout was amplifying an already stressed system. 115mg only in Phase 1."},
    {ph:1,label:"Phase 2",weeks:"Wks 5-8",color:C.yellow,total:"115-229mg",
     items:[{name:"XS Pre-Workout",mg:115,status:"on",time:"5:20 AM"},{name:"Coffee",mg:100,status:"cut",time:"Still off"},{name:"XS Energy Drink",mg:114,status:"conditional",time:"Training days before noon only"}],
     goal:"Add energy drink strategically as lifts get heavier.",
     note:"Only add XS Energy if you genuinely need it on heavy days. Not a daily habit. Before noon only."},
    {ph:2,label:"Phase 3",weeks:"Wks 9-12",color:C.red,total:"115mg train / 229mg rest",
     items:[{name:"XS Pre-Workout",mg:115,status:"on",time:"5:20 AM"},{name:"Coffee",mg:100,status:"cut",time:"Still off"},{name:"XS Energy Drink",mg:114,status:"conditional",time:"REST DAYS ONLY before 11am"}],
     goal:"Energy drink as fat-burning tool on rest days only.",
     note:"Phase 3 = precision. Rest day XS Energy boosts fat oxidation without spiking training cortisol."},
  ];

  return(
    <div style={{background:C.bg,minHeight:"100vh",color:C.text,fontFamily:FB,maxWidth:430,margin:"0 auto",position:"relative",paddingBottom:"calc(80px + env(safe-area-inset-bottom))"}}>

      {/* HEADER */}
      <div style={{paddingTop:"calc(16px + env(safe-area-inset-top))",paddingLeft:18,paddingRight:18,paddingBottom:16,background:C.surface}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <p style={{margin:0,fontSize:12,color:C.muted,letterSpacing:"0.28em",fontFamily:FB,fontWeight:600}}>HUSTLE &amp; HEART</p>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setGoalsOpen(true)}
              style={{background:"transparent",border:`1px solid ${goals.length?C.yellow:C.border}`,borderRadius:20,padding:"5px 11px",cursor:"pointer",fontSize:12,color:goals.length?C.yellow:C.steel,fontFamily:FB,fontWeight:500}}>
              Goals{goals.length?` · ${goals.length}`:""}
            </button>
            <button onClick={onLogout}
              style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:20,padding:"5px 11px",cursor:"pointer",fontSize:12,color:C.steel,fontFamily:FB,fontWeight:500}}>
              Switch

        </div>

        <div style={{marginBottom:16}}>

          </h1>
          <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:pc,fontFamily:FB,fontWeight:600}}>{PHASES[ph].label} · Week {currentWeek}</span>
            <span style={{width:3,height:3,borderRadius:"50%",background:C.dim}}/>
            <span style={{fontSize:12,color:C.steel,fontFamily:FB}}>{isTrainingToday?"Training Day":"Rest Day"}</span>
            {deload&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:10,background:"rgba(212,168,87,0.14)",color:C.yellow,fontFamily:FB,fontWeight:600,letterSpacing:"0.04em"}}>DELOAD</span>}
          </div>
          {goals.length>0&&(
            <p style={{margin:"6px 0 0",fontSize:12,color:C.steel,fontFamily:FB}}>
              Focus: {goals.map(gid=>GOALS.find(g=>g.id===gid)?.label).filter(Boolean).join(" · ")}

        {/* Glass stat card */}

          {needsSetup?(
            <div>
              <p style={{margin:"0 0 3px",fontSize:12,letterSpacing:"0.06em",color:C.muted,fontFamily:FB,fontWeight:600}}>BODY FAT</p>
              <p style={{margin:0,fontSize:13,fontWeight:600,color:C.yellow,fontFamily:FB,lineHeight:1.35}}>
                Set {user.name}'s baselines in Track to personalize this program.
              </p>

          ):(
            <div>
              <p style={{margin:"0 0 3px",fontSize:12,letterSpacing:"0.06em",color:C.muted,fontFamily:FB,fontWeight:600}}>BODY FAT</p>
              <p style={{margin:0,fontSize:21,fontWeight:700,color:C.text,fontFamily:FD,lineHeight:1}}>
                {curBF.toFixed(1)}<span style={{fontSize:12,color:C.muted,fontWeight:500}}> → {bfGoal.toFixed(1)}%</span>
              </p>
            </div>
          )}
          <svg width="48" height="48" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="5"/>
            <circle cx="24" cy="24" r="20" fill="none" stroke={C.greenBright} strokeWidth="5" strokeLinecap="round"
              strokeDasharray={125.7} strokeDashoffset={125.7*(1-bfProg)} transform="rotate(-90 24 24)" style={{transition:"stroke-dashoffset 0.4s ease"}}/>
            <text x="24" y="28" textAnchor="middle" fill={C.text} fontSize="12" fontWeight="700" fontFamily={FD}>{Math.round(bfProg*100)}%</text>
          </svg>
        </div>
      </div>

      <div style={{padding:"14px 14px 0"}}>

        {/* ══ WORKOUT TAB ══════════════════════════════════════════════════ */}
        {tab==="workout"&&(
          <div>
            {/* Apple Health sync banner (transient, this tab only) */}
            {healthBanner&&(()=>{
              const p=healthBanner;
              const parts=[];
              if(p.sleep!==undefined)parts.push(`Sleep ${p.sleep}h`);
              if(p.weight!==undefined)parts.push(`Weight ${p.weight} lb`);
              if(p.bf!==undefined)parts.push(`BF ${p.bf}%`);
              if(p.muscle!==undefined)parts.push(`Muscle ${p.muscle} lb`);
              if(p.steps!==undefined)parts.push(`Steps ${p.steps.toLocaleString("en-US")}`);
              if(p.exmin!==undefined)parts.push(`Exercise ${p.exmin} min`);
              if(p.rhr!==undefined)parts.push(`Resting HR ${p.rhr}`);

              const wPts=wVals.map((v,i)=>`${(i/(wVals.length-1))*(W-20)+10},${H-10-((v-wMin)/(wMax-wMin))*(H-20)}`).join(" ");
              const sPts=sVals.map((v,i)=>`${(i/(sVals.length-1))*(W-20)+10},${H-10-(v/sMax)*(H-20)}`).join(" ");

              return(

                      {m.rarm&&<span style={{fontSize:12,fontFamily:FC,color:C.text}}>R Arm: <span style={{color:C.yellow,fontWeight:"bold"}}>{m.rarm}"</span></span>}
                      {m.shoulder&&<span style={{fontSize:12,fontFamily:FC,color:C.text}}>Shoulder: <span style={{color:C.yellow,fontWeight:"bold"}}>{m.shoulder}"</span></span>}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* PR board */}
            <div style={{background:C.card,borderRadius:12,padding:"14px 16px",marginBottom:12,border:`1px solid ${C.yellow}44`}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                <Ic n="trophy" sz={18} col={C.yellow}/>
                <p style={{margin:0,fontSize:18,fontWeight:600,fontFamily:FD,color:C.yellow}}>Personal Records</p>
              </div>
              {WO[ph].map((day,di2)=>
                day.ex.filter(ex=>isCompound(ex.n)&&!ex.nw).map((ex,ei)=>{
                  const allWks=Array.from({length:currentWeek},(_,w)=>data[WK(ph,di2,ei,w+1)]||[]);
                  const best=allWks.reduce((best,sets)=>{
                    const top=(sets||[]).filter(s=>!s.isWarmup&&!s.isBurnout&&s.w&&s.r).sort((a,b)=>parseFloat(b.w)-parseFloat(a.w))[0];
                    const rm=top?calc1RM(top.w,top.r):0;
                    return rm>best.rm?{rm,w:top?.w,r:top?.r}:best;
                  },{rm:0});
                  if(!best.rm)return null;
                  return(
                    <div key={`${di2}_${ei}`} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:`1px solid ${C.border}33`}}>
                      <span style={{fontSize:12,color:C.text,fontFamily:FC}}>{ex.n}</span>
                      <div style={{textAlign:"right"}}>
                        <span style={{fontSize:14,fontWeight:"bold",color:C.yellow,fontFamily:FC}}>{best.rm}lb 1RM</span>
                        <p style={{margin:0,fontSize:11,color:C.muted,fontFamily:FB}}>{best.w}lb x {best.r}</p>
                      </div>
                    </div>
                  );
                })
              )}
              {/* Big 3 targets */}
              <div style={{marginTop:10,background:C.surface,borderRadius:8,padding:"10px 12px",border:`1px solid ${C.border}`}}>
                <p style={{margin:"0 0 6px",fontSize:12,color:C.yellow,fontFamily:FC,letterSpacing:"0.1em",textTransform:"uppercase"}}>THE MISSION - BIG 3</p>
                {needsSetup&&<p style={{margin:"0 0 6px",fontSize:12,color:C.yellow,fontFamily:FB}}>Set {user.name}'s baselines above to see personal record targets here.</p>}
                {(myStats&&myStats.prs?[{name:"Bench Press",current:myStats.prs.bench.c+"lb",target:myStats.prs.bench.t+"lb+"},{name:"Back Squat",current:myStats.prs.squat.c+"lb",target:myStats.prs.squat.t+"lb+"},{name:"Deadlift",current:myStats.prs.deadlift.c+"lb",target:myStats.prs.deadlift.t+"lb+"}]:[]).map((l,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:i<2?`1px solid ${C.border}33`:"none"}}>
                    <span style={{fontSize:12,fontFamily:FC,color:C.text}}>{l.name}</span>
                    <span style={{fontSize:12,fontFamily:FC}}><span style={{color:C.steel}}>{l.current}</span><span style={{color:C.muted}}> -> </span><span style={{color:C.yellow}}>{l.target}</span></span>
                  </div>
                ))}
              </div>
            </div>

            {/* BF journey */}
            <div style={{background:C.card,borderRadius:12,padding:"14px 16px",marginBottom:8,border:`1px solid ${C.border}`}}>
              <p style={{margin:"0 0 12px",fontSize:16,fontFamily:FD}}>BF% Journey</p>
              {needsSetup&&<p style={{margin:"0 0 8px",fontSize:12,color:C.yellow,fontFamily:FB}}>Set {user.name}'s baselines above to start the journey.</p>}
              {(needsSetup?[]:[{l:"Start",v:bfStart,c:C.red},{l:"Phase 1 end",v:myStats.journey?myStats.journey[1]:bfStart,c:C.yellow},{l:"Phase 2 end",v:myStats.journey?myStats.journey[2]:bfStart,c:C.yellow},{l:"Summer goal",v:bfGoal,c:C.green}]).map((p,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                  <span style={{fontSize:12,color:C.muted,minWidth:90,fontFamily:FC}}>{p.l}</span>
                  <div style={{flex:1,background:C.border,borderRadius:3,height:6}}>
                    <div style={{background:p.c,width:`${((p.v-8)/(12-8))*100}%`,height:"100%",borderRadius:3}}/>
                  </div>
                  <span style={{fontSize:12,fontWeight:"bold",color:p.c,minWidth:36,textAlign:"right",fontFamily:FC}}>{p.v}%</span>
                </div>
              ))}
              {!needsSetup&&<p style={{margin:"8px 0 0",fontSize:12,color:C.muted,fontFamily:FB}}>Current: <span style={{color:C.yellow,fontWeight:"bold"}}>{curBF.toFixed(1)}%</span> — {(curBF-bfGoal).toFixed(1)}% to go</p>}
            </div>

            {/* Smart Coach summary */}
            <div style={{background:C.card,borderRadius:12,padding:"14px 16px",marginBottom:12,border:`1px solid ${pc}33`}}>
              <p style={{margin:"0 0 12px",fontSize:16,fontFamily:FD}}>Smart Coach</p>
              {(()=>{
                const lines=[];
                if(readinessInfo)lines.push(`Readiness ${readinessInfo.score} — ${readinessInfo.lastNight.toFixed(1)}h sleep last night, averaging ${readinessInfo.sleepAvg.toFixed(1)}h${readinessInfo.why?` · ${readinessInfo.why}`:""}`);
                if(readinessInfo)lines.push(`Sleep average ${readinessInfo.sleepAvg.toFixed(1)}h across your last ${readinessInfo.sleepNights} logged night${readinessInfo.sleepNights===1?"":"s"}`);
                if(weightTrend){
                  const r=weightTrend.rate;
                  lines.push(r<-0.1?`Weight: losing ~${Math.abs(r).toFixed(1)} lb/wk over ${weightTrend.spanDays} days`
                    :r>0.1?`Weight: gaining ~${r.toFixed(1)} lb/wk over ${weightTrend.spanDays} days`
                    :`Weight: flat over ${weightTrend.spanDays} days (${r>0?"+":""}${r.toFixed(1)} lb/wk)`);
                }
                if(fastestLift)lines.push(`${fastestLift.name} is your fastest gainer at +${fastestLift.slope.toFixed(1)} lb/wk`);
                if(stalledExercises.length)lines.push(`Stalled: ${stalledExercises.join(", ")} — missed targets two logged weeks in a row`);
                if(personalPaceCount>0)lines.push(`${personalPaceCount} lift${personalPaceCount>1?"s are":" is"} on a personal pace learned from your log`);
                if(lastHealth){
                  const hp=[];
                  if(lastHealth.steps!=null)hp.push(`${Number(lastHealth.steps).toLocaleString("en-US")} steps`);
                  if(lastHealth.exmin!=null)hp.push(`${lastHealth.exmin} exercise min`);
                  if(hp.length){
                    const lbl=lastHealth.iso===isoToday()?"Today":lastHealth.iso===isoDaysAgo(1)?"Yesterday":lastHealth.date;
                    lines.push(`${lbl}: ${hp.join(" · ")}`);
                  }
                }
                if(!lines.length)return <p style={{margin:0,fontSize:12,color:C.muted,fontFamily:FB,lineHeight:1.5}}>Smart Coach wakes up as you log — sleep, weight and a few weeks of lifts switch on readiness, calorie steering and personal pacing.</p>;
                return lines.map((l,i)=>(<p key={i} style={{margin:i?"6px 0 0":0,fontSize:12,color:C.text,fontFamily:FB,lineHeight:1.5}}>• {l}</p>));
              })()}
            </div>

            {/* Progress charts */}
            <div style={{background:C.card,borderRadius:12,padding:"14px 16px",marginBottom:12,border:`1px solid ${C.border}`}}>
              <p style={{margin:"0 0 12px",fontSize:16,fontFamily:FD}}>Progress Charts</p>
              <p style={{margin:"0 0 8px",fontSize:12,color:C.muted,fontFamily:FC,letterSpacing:"0.12em",textTransform:"uppercase"}}>Strength Trends · est. 1RM</p>
              {strengthTrends.length===0&&<p style={{margin:"0 0 12px",fontSize:12,color:C.muted,fontFamily:FB,lineHeight:1.5}}>Log the same lift in 2+ weeks to see strength trends here.</p>}
              {strengthTrends.map(t=>{
                const maxV=Math.max(...t.series.map(s=>s.v));
                return(
                  <div key={t.name} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
                      <span style={{fontSize:12,fontFamily:FC,color:C.text}}>{t.name}</span>
                      <span style={{fontSize:12,fontFamily:FC,color:C.muted}}>{t.first} → <span style={{color:C.text,fontWeight:"bold"}}>{t.latest}</span> lb <span style={{color:t.delta>=0?C.green:C.red,fontWeight:"bold"}}>{t.delta>=0?"+":""}{t.delta.toFixed(1)}%</span>{t.slope!==null&&<span style={{color:t.slope>=0?C.green:C.red}}> · {t.slope>=0?"+":""}{t.slope.toFixed(1)} lb/wk</span>}</span>
                    </div>
                    {t.proj&&(
                      <p style={{margin:"2px 0 0",fontSize:12,color:C.steel,fontFamily:FB}}>
                        → on pace for {t.proj.goal} lb {t.proj.eta?`around Week ${t.proj.eta}`:"beyond this cycle"}
                      </p>
                    )}
                    <div style={{display:"flex",alignItems:"flex-end",gap:3,height:38,marginTop:4}}>
                      {t.series.map(s=>(
                        <div key={s.w} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                          <div style={{width:"100%",height:Math.max(3,Math.round(s.v/maxV*26)),background:pc,borderRadius:2,opacity:0.85}}/>
                          <span style={{fontSize:8,color:C.muted,fontFamily:FC}}>W{s.w}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
              <p style={{margin:"14px 0 8px",fontSize:12,color:C.muted,fontFamily:FC,letterSpacing:"0.12em",textTransform:"uppercase"}}>Weekly Adherence</p>
              {!adherence&&<p style={{margin:0,fontSize:12,color:C.muted,fontFamily:FB,lineHeight:1.5}}>No completed exercises yet — finish a session and your weekly adherence will show here.</p>}
              {adherence&&adherence.map(r=>(
                <div key={r.w} style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                  <span style={{fontSize:12,color:C.muted,minWidth:28,fontFamily:FC}}>W{r.w}</span>
                  <div style={{flex:1,background:C.border,borderRadius:3,height:8}}>
                    <div style={{background:r.pct>=80?C.green:r.pct>=50?C.yellow:C.red,width:`${r.pct}%`,height:"100%",borderRadius:3}}/>
                  </div>
                  <span style={{fontSize:12,fontWeight:"bold",color:C.text,minWidth:36,textAlign:"right",fontFamily:FC}}>{r.pct}%</span>
                </div>
              ))}
            </div>
          </div>
        )}


        {/* ══ SKILLS TAB ═══════════════════════════════════════════════════ */}
        {tab==="skills"&&(
          <div>
            <p style={{margin:"0 0 14px",fontSize:12,color:C.muted,fontFamily:FB,lineHeight:1.5}}>
              Manual progression — you decide when a level is earned. Log practice sessions as you go.
            </p>
            {sortedSkills.map(sk=>{
              const state=getSkill(sk.id);
              const maxLevel=sk.levels.length-1;
              const atMax=state.level>=maxLevel;
              const current=sk.levels[state.level];
              const next=sk.levels[state.level+1];
              const draft=skillLogDraft[sk.id]||{hold:"",note:""};
              const matchesGoal=sk.tags.some(t=>goalTags.includes(t));
              return(
                <div key={sk.id} style={{background:C.card,borderRadius:12,padding:"14px 16px",marginBottom:12,border:`1px solid ${matchesGoal?C.yellow+"55":C.border}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <p style={{margin:0,fontSize:17,fontFamily:FD,color:matchesGoal?C.yellow:C.text}}>{sk.label}</p>
                    <span style={{fontSize:12,color:C.muted,fontFamily:FC}}>LVL {state.level+1}/{sk.levels.length}</span>
                  </div>
                  <div style={{width:"100%",height:4,background:C.border,borderRadius:2,marginBottom:10}}>
                    <div style={{width:`${((state.level+1)/sk.levels.length)*100}%`,height:"100%",background:matchesGoal?C.yellow:C.steel,borderRadius:2}}/>
                  </div>
                  <p style={{margin:0,fontSize:13,fontFamily:FC,fontWeight:700,color:C.text}}>{current.title}</p>
                  <p style={{margin:"2px 0 10px",fontSize:12,color:C.muted,fontFamily:FB,lineHeight:1.5}}>{current.criteria}</p>
                  {!atMax&&(
                    <div style={{background:C.surface,borderRadius:8,padding:"8px 10px",marginBottom:10,border:`1px solid ${C.border}`}}>
                      <p style={{margin:0,fontSize:12,color:C.steel,fontFamily:FB}}>Next: <span style={{color:C.text}}>{next.title}</span> — {next.criteria}</p>
                    </div>
                  )}
                  <div style={{display:"flex",gap:6,marginBottom:10}}>
                    <input value={draft.hold} onChange={e=>setSkillLogDraft({...skillLogDraft,[sk.id]:{...draft,hold:e.target.value}})} placeholder="Hold (s)" type="number"
                      style={{width:70,background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,padding:"8px",color:C.text,fontSize:12,fontFamily:FC,outline:"none",textAlign:"center"}}/>
                    <input value={draft.note} onChange={e=>setSkillLogDraft({...skillLogDraft,[sk.id]:{...draft,note:e.target.value}})} placeholder="Notes..."
                      style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,padding:"8px 10px",color:C.text,fontSize:12,fontFamily:FB,outline:"none"}}/>
                    <button onClick={()=>logSkillPractice(sk.id)} style={{background:C.steel,color:"#000",border:"none",borderRadius:7,padding:"8px 12px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:FC}}>LOG</button>
                  </div>
                  <button onClick={()=>handleAdvanceSkill(sk)} disabled={atMax}
                    style={{width:"100%",background:atMax?C.border:armedSkill===sk.id?C.red:C.yellow,color:atMax?C.muted:armedSkill===sk.id?"#fff":"#000",border:"none",borderRadius:8,padding:"10px",fontSize:12,fontWeight:700,cursor:atMax?"default":"pointer",fontFamily:FC,letterSpacing:"0.08em"}}>
                    {atMax?"MAX LEVEL REACHED":armedSkill===sk.id?"TAP AGAIN TO CONFIRM":"ADVANCE TO NEXT LEVEL"}
                  </button>
                  {state.level>0&&(
                    <button onClick={()=>regressSkillLevel(sk.id)}
                      style={{width:"100%",marginTop:6,background:"none",border:"none",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:FC,letterSpacing:"0.08em"}}>
                      ← BACK A LEVEL
                    </button>
                  )}
                  {(state.log||[]).length>0&&(
                    <div style={{marginTop:10}}>
                      {state.log.slice().reverse().slice(0,3).map((e,i)=>(
                        <p key={i} style={{margin:"0 0 4px",fontSize:12,color:C.muted,fontFamily:FB}}>
                          {e.date}{e.holdSeconds?` · ${e.holdSeconds}s`:""}{e.note?` · ${e.note}`:""}
                        </p>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

      </div>{/* end padding div */}

      {/* ── BOTTOM NAV ────────────────────────────────────────────────────── */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:C.bg,borderTop:`1px solid rgba(255,255,255,0.06)`,display:"flex",paddingBottom:"calc(16px + env(safe-area-inset-bottom))"}}>
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>setTab(n.id)} style={{flex:1,background:"none",border:"none",padding:"12px 4px 2px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
            <Ic n={n.ic} sz={19} col={tab===n.id?pc:C.muted}/>
            <span style={{fontSize:11,color:tab===n.id?pc:C.muted,fontWeight:tab===n.id?600:500,fontFamily:FB}}>{n.lb}</span>
          </button>
        ))}
      </div>

      {/* ── MODALS ────────────────────────────────────────────────────────── */}
      {lm!==null&&(
        <LogModal
          key={`lm_${ph}_${di}_${lm}`}
          ex={wo.ex[lm]}
          hasNext={nextExIdx(lm,data)>=0}
          pc={pc}
          lastSets={data[`p${ph}_d${di}_e${lm}`]}
          targets={getTargets(lm)}
          week={currentWeek}
          phase={ph}
          allHistory={getHistory(lm)}
          onSave={(sets,note)=>saveLog(lm,sets,note)}
          onClose={()=>setLm(null)}
        />
      )}
      {timerOpen&&<RestTimer onClose={()=>setTimerOpen(false)}/>}
      {sessionDone&&(
        <SessionComplete
          wo={wo} data={data} ph={ph} di={di} week={currentWeek}
          onClose={()=>setSessionDone(false)}
        />
      )}
      {goalsOpen&&<GoalsPanel selected={goals} onToggle={toggleGoal} onClose={()=>setGoalsOpen(false)}/>}
      {assessmentOpen&&<AssessmentFlow onComplete={completeAssessment} onClose={()=>setAssessmentOpen(false)}/>}
      {runningRoutine&&(
        <RoutineRunner
          routine={runningRoutine}
          onComplete={()=>completeRoutine(runningRoutine)}
          onClose={()=>setRunningRoutine(null)}
        />
      )}
      {runningConditioning&&(
        <RoutineRunner
          routine={runningConditioning}
          onComplete={()=>completeConditioning(runningConditioning)}
          onClose={()=>setRunningConditioning(null)}
        />
      )}
      {pendingConditioningRPE&&(
        <ConditioningRPEModal
          onSubmit={rpe=>logConditioningRPE(rpe)}
          onClose={()=>logConditioningRPE(null)}
        />
      )}
    </div>
  );
}

function App(){
  const [activeUser,setActiveUser_] = useState(getActiveUser);
  // Apple Health bridge intake: stage any #h= payload from a shortcut
  // deep link (and strip the hash) SYNCHRONOUSLY on first render — child
  // effects run before parent effects, so doing this in a useEffect here
  // would stage the payload only AFTER AppInner's apply check had already
  // run, and the sync would not surface until the next page load.
  useState(()=>{ intakeHealthHash(); return true; });
  const pin = activeUser?.pin;
  const user = pin ? USERS[pin] : null;
  const handleLogin = (p) => { setActiveUser(p); setActiveUser_({pin:p,ts:Date.now()}); };
  const handleLogout = () => { clearActiveUser(); setActiveUser_(null); };
  if (!user) return <LoginScreen onLogin={handleLogin}/>;
  return <AppInner pin={pin} user={user} onLogout={handleLogout}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>

  <script>
  // ── SERVICE WORKER + PWA ─────────────────────────────────────────────────
  const VAPID_PUBLIC_KEY = 'YOUR_VAPID_PUBLIC_KEY';
  function urlBase64ToUint8Array(b64){
    const pad='='.repeat((4-b64.length%4)%4);
    const b=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
    const raw=window.atob(b);
    return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
  }
  async function registerSW(){
    if(!('serviceWorker' in navigator))return;
    try{
      const reg=await navigator.serviceWorker.register('/sw.js');
      const perm=await Notification.requestPermission();
      if(perm!=='granted')return;
      let sub=await reg.pushManager.getSubscription();
      if(!sub){sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});}
      await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub})});
    }catch(e){console.log('SW:',e);}
  }
  window.addEventListener('load',registerSW);
  </script>
</body>
